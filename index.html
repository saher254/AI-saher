<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="day">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <title>ساهر AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://js.puter.com/v2/"></script>

    <style>
        :root[data-theme="day"] {
            --bg-body: linear-gradient(135deg, #3b2d8e 0%, #6a48b8 50%, #9b5fc2 100%);
            --bg-panel: rgba(255, 255, 255, 0.1);
            --bg-panel-light: rgba(255, 255, 255, 0.15);
            --bg-header: rgba(59, 45, 142, 0.85);
            --bg-input: rgba(255, 255, 255, 0.08);
            --primary: #ff6b9d;
            --primary-hover: #ff4784;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.7);
            --msg-user: linear-gradient(135deg, #ff6b9d, #d946a8);
            --msg-bot: rgba(255, 255, 255, 0.15);
            --border-color: rgba(255, 255, 255, 0.15);
            --danger: #ef4444;
            --example-bg: rgba(255, 255, 255, 0.08);
        }

        :root[data-theme="night"] {
            --bg-body: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
            --bg-panel: #1e293b;
            --bg-panel-light: #334155;
            --bg-header: rgba(15, 23, 42, 0.85);
            --bg-input: #1e293b;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --msg-user: linear-gradient(135deg, #8b5cf6, #6d28d9);
            --msg-bot: #1e293b;
            --border-color: rgba(255,255,255,0.08);
            --danger: #ef4444;
            --example-bg: rgba(255, 255, 255, 0.05);
        }

        * { 
            font-family: 'Tajawal', sans-serif; 
            box-sizing: border-box; 
            margin: 0; padding: 0; 
            -webkit-tap-highlight-color: transparent;
            transition: background 0.5s ease, color 0.5s ease, border-color 0.5s ease, box-shadow 0.3s ease;
        }

        html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }

        body { 
            background: var(--bg-body);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            height: 100vh;
            height: 100dvh; 
            transition: background 0.5s ease;
        }

        /* ===== الشريط الجانبي ===== */
        .sidebar {
            width: 280px;
            background: var(--bg-header);
            backdrop-filter: blur(20px);
            border-left: 1px solid var(--border-color);
            display: flex; flex-direction: column;
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: fixed; top: 0; bottom: 0; right: -280px; z-index: 1000;
            padding-top: env(safe-area-inset-top, 0px);
        }
        .sidebar.open { transform: translateX(-280px); }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex; justify-content: space-between; align-items: center;
        }
        .sidebar-header h3 { font-size: 1.1rem; font-weight: 700; color: #fff; }
        .close-sidebar { background: none; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; }

        .new-chat-btn {
            margin: 15px; padding: 14px; background: var(--primary); color: white;
            border: none; border-radius: 14px; cursor: pointer; font-size: 1rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: 0.2s; box-shadow: 0 4px 15px rgba(255, 107, 157, 0.3);
        }
        .new-chat-btn:hover { background: var(--primary-hover); transform: translateY(-2px); }

        .chat-history-list { flex: 1; overflow-y: auto; padding: 10px 15px; display: flex; flex-direction: column; gap: 8px; }
        .history-item {
            padding: 14px 15px; background: rgba(255,255,255,0.05); border-radius: 12px;
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            transition: 0.2s; border: 1px solid transparent;
        }
        .history-item:hover { background: rgba(255,255,255,0.1); border-color: var(--border-color); }
        .history-item.active { background: rgba(255, 107, 157, 0.15); border-color: var(--primary); }
        .history-title { font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; margin-left: 10px; }
        
        .delete-history-btn { 
            background: none; border: none; color: var(--danger); cursor: pointer; 
            opacity: 0.5; transition: 0.2s; font-size: 0.9rem; padding: 5px; 
        }
        .delete-history-btn:hover { opacity: 1; transform: scale(1.1); }

        /* ===== المساحة الرئيسية ===== */
        .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; }

        .header {
            background: var(--bg-header); backdrop-filter: blur(15px);
            padding: 15px 20px; 
            padding-top: calc(15px + env(safe-area-inset-top, 0px));
            display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border-color); z-index: 10;
        }
        .menu-btn { background: none; border: none; color: var(--text-main); font-size: 1.4rem; cursor: pointer; padding: 5px; }
        
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.2rem; }
        .brand-icon { 
            width: 38px; height: 38px; border-radius: 12px; 
            background: linear-gradient(135deg, var(--primary), #ff8cb5); 
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
            box-shadow: 0 0 15px rgba(255, 107, 157, 0.4);
        }

        .theme-toggle-btn {
            background: rgba(255,255,255,0.1); 
            border: 1px solid var(--border-color); 
            color: var(--text-main);
            width: 40px; height: 40px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); 
            font-size: 1.1rem; overflow: hidden;
        }
        .theme-toggle-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.1) rotate(15deg); }
        .theme-toggle-btn i { transition: transform 0.5s ease; }
        .theme-toggle-btn.animating i { transform: rotate(360deg) scale(0); }

        .chat-area { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }

        .welcome { text-align: center; margin: auto; max-width: 500px; padding: 10px; }
        .welcome-icon { 
            font-size: 4rem; margin-bottom: 20px; 
            background: linear-gradient(135deg, #ffd700, #ffb700); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 15px rgba(255, 215, 0, 0.4));
            animation: float 3s ease-in-out infinite;
        }
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        
        .welcome h2 { font-size: 1.8rem; margin-bottom: 10px; font-weight: 700; }
        .welcome p { color: var(--text-muted); font-size: 1rem; line-height: 1.7; margin-bottom: 30px; }

        .suggestions { display: flex; flex-direction: column; gap: 12px; text-align: right; }
        .suggestion-card { 
            background: var(--example-bg); padding: 18px 20px; border-radius: 16px; 
            cursor: pointer; border: 1px solid var(--border-color); transition: 0.3s;
            display: flex; align-items: center; gap: 12px;
            backdrop-filter: blur(10px);
        }
        .suggestion-card:hover { background: rgba(255,255,255,0.15); transform: translateX(-5px); border-color: var(--primary); }
        .suggestion-card i { color: #ffd700; font-size: 1.2rem; }
        .suggestion-card span { font-size: 0.95rem; font-weight: 500; }

        .msg { display: flex; gap: 12px; max-width: 85%; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .msg.user { align-self: flex-end; flex-direction: row-reverse; }
        .msg.bot { align-self: flex-start; }
        .msg-avatar { width: 38px; height: 38px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
        .msg.user .msg-avatar { background: var(--bg-panel-light); color: var(--text-main); }
        .msg.bot .msg-avatar { background: linear-gradient(135deg, var(--primary), #ff8cb5); color: white; }
        
        .msg-bubble { padding: 15px 20px; border-radius: 20px; font-size: 0.95rem; line-height: 1.7; white-space: pre-wrap; word-wrap: break-word; backdrop-filter: blur(10px); }
        .msg.user .msg-bubble { background: var(--msg-user); color: white; border-bottom-right-radius: 4px; box-shadow: 0 4px 15px rgba(255, 107, 157, 0.2); }
        .msg.bot .msg-bubble { background: var(--msg-bot); color: var(--text-main); border-bottom-left-radius: 4px; border: 1px solid var(--border-color); }

        .typing { display: flex; gap: 6px; padding: 18px 22px; background: var(--msg-bot); border-radius: 20px; border-bottom-left-radius: 4px; width: fit-content; border: 1px solid var(--border-color); }
        .typing span { width: 8px; height: 8px; background: var(--primary); border-radius: 50%; animation: bounce 1.4s infinite; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); opacity: 0.4; } 30% { transform: translateY(-8px); opacity: 1; } }

        .input-area { 
            padding: 15px 20px; 
            padding-bottom: calc(15px + env(safe-area-inset-bottom, 0px)); 
            background: var(--bg-header); backdrop-filter: blur(15px); 
            border-top: 1px solid var(--border-color); z-index: 10; 
        }
        .input-container { 
            width: 100%; max-width: 800px; margin: auto; display: flex; align-items: center; 
            background: var(--bg-input); border-radius: 30px; border: 1px solid var(--border-color); 
            padding: 5px 8px 5px 15px; transition: border-color 0.3s; backdrop-filter: blur(10px);
        }
        .input-container:focus-within { border-color: var(--primary); box-shadow: 0 0 10px rgba(255, 107, 157, 0.2); }
        
        .input-field { flex: 1; background: transparent; border: none; padding: 12px 5px; color: var(--text-main); font-size: 1rem; outline: none; min-width: 0; }
        .input-field::placeholder { color: var(--text-muted); font-size: 0.95rem; }
        
        .send-btn { 
            width: 50px; height: 50px; border-radius: 18px; border: none; 
            background: linear-gradient(135deg, #ff6b9d, #d946a8); color: white; 
            font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; 
            transition: 0.3s; flex-shrink: 0; margin-right: 5px;
            box-shadow: 0 4px 15px rgba(255, 107, 157, 0.4);
        }
        .send-btn:hover { transform: scale(1.05) rotate(-10deg); box-shadow: 0 6px 20px rgba(255, 107, 157, 0.6); }
        .send-btn:disabled { background: var(--bg-panel-light); color: var(--text-muted); cursor: not-allowed; transform: none; box-shadow: none; }

        .action-btn.add-img-btn {
            background: transparent; border: none; color: var(--text-muted);
            font-size: 1.3rem; cursor: pointer; padding: 0 8px; transition: color 0.2s;
            flex-shrink: 0;
        }
        .action-btn.add-img-btn:hover { color: var(--primary); }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 900; display: none; backdrop-filter: blur(3px); }
        .overlay.show { display: block; }

        @media (max-width: 600px) {
            .msg { max-width: 92%; }
            .brand { font-size: 1.1rem; }
            .welcome h2 { font-size: 1.6rem; }
            .chat-area { padding: 15px; gap: 15px; }
            .input-field { font-size: 16px; }
        }
    </style>
</head>
<body>

    <div class="overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3>سجل المحادثات</h3>
            <button class="close-sidebar" onclick="toggleSidebar()"><i class="fas fa-times"></i></button>
        </div>
        <button class="new-chat-btn" onclick="startNewChat()">
            <i class="fas fa-plus"></i> محادثة جديدة
        </button>
        <div class="chat-history-list" id="chatHistoryList"></div>
    </div>

    <div class="main-content">
        <div class="header">
            <button class="menu-btn" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
            <div class="brand">
                <div class="brand-icon"><i class="fas fa-robot"></i></div>
                ساهر AI
            </div>
            <button class="theme-toggle-btn" id="themeBtn" onclick="toggleTheme()" title="تغيير المظهر">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>
        </div>

        <div class="chat-area" id="chatArea">
            <div class="welcome" id="welcomeScreen">
                <div class="welcome-icon"><i class="fas fa-star"></i></div>
                <h2>أهلاً بك في AI ساهر</h2>
                <p>مساعدك الذكي الذي يتعلم منك ومن كل المستخدمين. اسألني أي حاجة في أي مجال، وأنا هحاول أجاوبك.</p>
                <div class="suggestions">
                    <div class="suggestion-card" onclick="fillAndAsk('ما هي عاصمة مصر')">
                        <i class="fas fa-lightbulb"></i> <span>ما هي عاصمة مصر</span>
                    </div>
                    <div class="suggestion-card" onclick="fillAndAsk('ازيك')">
                        <i class="fas fa-lightbulb"></i> <span>ازيك</span>
                    </div>
                    <div class="suggestion-card" onclick="fillAndAsk('اشرحلي البرمجة ببساطة')">
                        <i class="fas fa-lightbulb"></i> <span>اشرحلي البرمجة ببساطة</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-container">
                <button class="action-btn add-img-btn" onclick="document.getElementById('imageInput').click()" title="ارفع صورة">
                    <i class="fas fa-image"></i>
                </button>
                <input type="file" id="imageInput" accept="image/*" style="display:none;" onchange="handleImageSelect(this)">
                
                <input type="text" class="input-field" id="userInput" placeholder="اكتب سؤالك هنا..." autocomplete="off" onkeydown="if(event.key==='Enter') ask()">
                
                <button class="send-btn" id="sendBtn" onclick="ask()">
                    <i class="fas fa-paper-plane"></i>
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, deleteDoc, query, where, orderBy, limit, updateDoc } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAUmHcm0d0ErUph8l132llavVcUfwHWfic",
            authDomain: "gaming-platform-5ef6c.firebaseapp.com",
            projectId: "gaming-platform-5ef6c",
            storageBucket: "gaming-platform-5ef6c.firebasestorage.app",
            messagingSenderId: "332262507211",
            appId: "1:332262507211:web:dd51b094b7d3e4ab68914e"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const knowledgeCol = collection(db, "knowledge");
        const chatsCol = collection(db, "chats");

        let memory = [];
        let loadingDB = true;
        let selectedImageFile = null;
        
        let userId = localStorage.getItem('saher_user_id');
        if (!userId) {
            userId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
            localStorage.setItem('saher_user_id', userId);
        }

        let allChats = [];
        let currentChatId = null;
        let currentChatHistory = [];

        const SYSTEM_PROMPT = `أنت "ساهر"، مساعد ذكي عام وودود.
        قواعدك:
        1. جاوب على أي سؤال يسأله المستخدم، سواء كان دراسي، عام، تقني، ثقافي، ديني، رياضي، أو ترفيهي.
        2. خليك مفيد ومباشر في إجاباتك.
        3. لو السؤال مش واضح، اسأل المستخدم يوضح.
        4. لو السؤال فيه إساءة أو مشكلة، رد بأدب ومحاولة مساعدة.
        5. إجاباتك تكون مختصرة وكافية.`;

        function normalize(t) { return t.toLowerCase().trim().replace(/[؟?!.,،؛:]/g, "").replace(/[إأآا]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/\s+/g, " ").trim(); }
        const STOP = ["ما","هي","هو","هم","في","من","عن","على","الى","إلى","ايه","إيه","ال","هل","كان","كانت","يا","بس","دي","ده","دا","اللي"];
        function getWords(t) { return normalize(t).split(" ").filter(w => w && !STOP.includes(w)); }
        function wordSim(a, b) { if (a === b) return 1; if (a.length < 2 || b.length < 2) return 0; if (a.startsWith(b) || b.startsWith(a)) return 0.9; let common = 0; const bChars = b.split(""); for (let c of a) { const i = bChars.indexOf(c); if (i !== -1) { common++; bChars.splice(i, 1); } } return (2 * common) / (a.length + b.length); }
        function similarity(q1, q2) { if (normalize(q1) === normalize(q2)) return 1; const w1 = getWords(q1), w2 = getWords(q2); if (!w1.length || !w2.length) return 0; let m1 = 0; for (let a of w1) { let best = 0; for (let b of w2) best = Math.max(best, wordSim(a, b)); m1 += best; } const cov1 = m1 / w1.length; let m2 = 0; for (let b of w2) { let best = 0; for (let a of w1) best = Math.max(best, wordSim(b, a)); m2 += best; } const cov2 = m2 / w2.length; return (cov1 + cov2) / 2; }
        function findBestMatch(text) { let best = null, score = 0; for (let item of memory) { const s = similarity(text, item.question); if (s > score) { score = s; best = item; } } return (best && score >= 0.70) ? best : null; }

        async function loadDB() {
            try {
                const snap = await getDocs(knowledgeCol);
                memory = [];
                snap.forEach(d => { const data = d.data(); memory.push({ question: data.question || "", answer: data.answer || "" }); });
                loadingDB = false;
            } catch (e) { console.error("خطأ في Firebase:", e); loadingDB = false; }
        }

        window.toggleTheme = function() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            if (html.getAttribute('data-theme') === 'dark') {
                html.setAttribute('data-theme', 'light');
                icon.classList.replace('fa-sun', 'fa-moon');
                localStorage.setItem('saher_theme', 'light');
            } else {
                html.setAttribute('data-theme', 'dark');
                icon.classList.replace('fa-moon', 'fa-sun');
                localStorage.setItem('saher_theme', 'dark');
            }
        }

        const savedTheme = localStorage.getItem('saher_theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'light') {
            document.getElementById('themeIcon').classList.replace('fa-sun', 'fa-moon');
        }

        window.toggleSidebar = function() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function loadChatsFromStorage() {
            allChats = JSON.parse(localStorage.getItem('saher_chats_v5')) || [];
            renderHistoryList();
        }

        function saveChatsToStorage() {
            localStorage.setItem('saher_chats_v5', JSON.stringify(allChats));
        }

                function renderHistoryList() {
            const list = document.getElementById('chatHistoryList');
            list.innerHTML = '';
            if (allChats.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.85rem; margin-top:20px;">لا توجد محادثات سابقة</p>';
                return;
            }
            allChats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
                div.innerHTML = `
                    <span class="history-title" onclick="loadChat('${chat.id}')">${chat.title || 'محادثة بدون عنوان'}</span>
                    <button class="delete-history-btn" onclick="deleteChat(event, '${chat.id}')"><i class="fas fa-trash"></i></button>
                `;
                list.appendChild(div);
            });
        }

        window.deleteChat = function(e, id) {
            e.stopPropagation();
            if(confirm("هل تريد مسح هذه المحادثة من السجل؟")) {
                allChats = allChats.filter(c => c.id !== id);
                saveChatsToStorage();
                if (currentChatId === id) startNewChat();
                else renderHistoryList();
            }
        }

        window.loadChat = function(id) {
            const chat = allChats.find(c => c.id === id);
            if (!chat) return;
            currentChatId = id;
            currentChatHistory = chat.messages || [];
            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML = '';
            if (currentChatHistory.length > 0) {
                currentChatHistory.forEach(msg => {
                    if(msg.role === 'user') {
                        if (msg.image) addMessage(msg.image, true, true);
                        else addMessage(msg.content, true);
                    }
                    else addMessage(msg.content, false);
                });
            } else {
                chatArea.innerHTML = '<div class="welcome"><h2>المحادثة فارغة</h2></div>';
            }
            renderHistoryList();
            toggleSidebar();
        }

        window.startNewChat = function() {
            currentChatId = null;
            currentChatHistory = [];
            removeImagePreview();
            document.getElementById('chatArea').innerHTML = `
                <div class="welcome" id="welcomeScreen">
                    <div class="welcome-icon"><i class="fas fa-star"></i></div>
                    <h2>أهلاً بك في AI ساهر</h2>
                    <p>مساعدك الذكي الذي يتعلم منك ومن كل المستخدمين. اسألني أي حاجة في أي مجال، وأنا هحاول أجاوبك.</p>
                    <div class="suggestions">
                        <div class="suggestion-card" onclick="fillAndAsk('ما هي عاصمة مصر')"><i class="fas fa-lightbulb"></i> <span>ما هي عاصمة مصر</span></div>
                        <div class="suggestion-card" onclick="fillAndAsk('ازيك')"><i class="fas fa-lightbulb"></i> <span>ازيك</span></div>
                        <div class="suggestion-card" onclick="fillAndAsk('اشرحلي البرمجة ببساطة')"><i class="fas fa-lightbulb"></i> <span>اشرحلي البرمجة ببساطة</span></div>
                    </div>
                </div>
            `;
            renderHistoryList();
            if(document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
        }

        function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

        function addMessage(text, isUser, isImage = false) {
            const welcome = document.getElementById("welcomeScreen");
            if (welcome) welcome.remove();
            const chatArea = document.getElementById("chatArea");
            const div = document.createElement("div");
            div.className = "msg " + (isUser ? "user" : "bot");
            
            let bubbleContent = "";
            if (isImage) {
                bubbleContent = `<img src="${text}" class="chat-img">`;
            } else {
                bubbleContent = esc(text);
            }

            div.innerHTML = `
                <div class="msg-avatar"><i class="fas ${isUser ? 'fa-user' : 'fa-robot'}"></i></div>
                <div class="msg-bubble">${bubbleContent}</div>
            `;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function showTyping() {
            const chatArea = document.getElementById("chatArea");
            const div = document.createElement("div");
            div.className = "msg bot"; div.id = "typingMsg";
            div.innerHTML = `<div class="msg-avatar"><i class="fas fa-robot"></i></div><div class="typing"><span></span><span></span><span></span></div>`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function hideTyping() { const t = document.getElementById("typingMsg"); if (t) t.remove(); }

        window.fillAndAsk = function(text) {
            document.getElementById("userInput").value = text;
            ask();
        }

        window.handleImageSelect = function(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    selectedImageBase64 = e.target.result;
                    document.getElementById('imagePreviewImg').src = selectedImageBase64;
                    document.getElementById('imagePreviewBox').classList.add('active');
                };
                reader.readAsDataURL(input.files[0]);
            }
        };

        window.removeImagePreview = function() {
            selectedImageBase64 = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('imagePreviewImg').src = '';
            document.getElementById('imagePreviewBox').classList.remove('active');
        };

        window.ask = async function() {
            const input = document.getElementById("userInput");
            const question = input.value.trim();
            
            if (!question && !selectedImageBase64) return;

            const finalQuestion = question || "اشرح لي هذه الصورة وحل أي واجب فيها";
            input.value = ""; // مسح خانة الكتابة فوراً
            
            const sendBtn = document.getElementById("sendBtn");
            sendBtn.disabled = true;

            if (selectedImageBase64) addMessage(selectedImageBase64, true, true);
            addMessage(finalQuestion, true);
            
            showTyping();
            let isImageQuery = selectedImageBase64 !== null;
            const imgToSave = selectedImageBase64;

            removeImagePreview();

            if (!isImageQuery && !loadingDB) {
                const match = findBestMatch(finalQuestion);
                if (match) {
                    setTimeout(() => {
                        hideTyping();
                        addMessage(match.answer, false);
                        saveChatToStorage(finalQuestion, match.answer);
                        sendBtn.disabled = false;
                    }, 300);
                    return;
                }
            }

            try {
                if (isImageQuery) {
                    const response = await puter.ai.chat(finalQuestion, imgToSave, { model: 'google/gemini-2.5-flash' });
                    hideTyping();
                    let aiReply = extractReply(response);
                    addMessage(aiReply, false);
                    saveChatToStorage("[📸 صورة] " + finalQuestion, aiReply, imgToSave);
                } else {
                    currentChatHistory.push({ role: "user", content: finalQuestion });
                    if (currentChatHistory.length > 10) currentChatHistory = currentChatHistory.slice(-10);
                    const messages = [ { role: "system", content: SYSTEM_PROMPT }, ...currentChatHistory ];
                    const response = await puter.ai.chat(messages, { model: 'google/gemini-2.5-flash' });
                    hideTyping();
                    let aiReply = extractReply(response);
                    addMessage(aiReply, false);
                    saveChatToStorage(finalQuestion, aiReply);
                }
            } catch (error) {
                hideTyping();
                console.error("❌ خطأ:", error);
                addMessage("عذراً، حصلت مشكلة في الاتصال. تأكد إنك سجلت الدخول وحاول تاني.", false);
            } finally {
                sendBtn.disabled = false;
            }
        }

        function extractReply(response) {
            if (typeof response === 'string') return response;
            if (response && response.message && response.message.content) {
                if (Array.isArray(response.message.content)) return response.message.content.map(c => c.text || "").join("");
                return response.message.content;
            }
            if (response && response.text) return response.text;
            return JSON.stringify(response);
        }

        function saveChatToStorage(userQ, botA, imageBase64 = null) {
            let userMessageObj = { role: "user", content: userQ };
            if (imageBase64) userMessageObj.image = imageBase64;
            
            currentChatHistory.push(userMessageObj);
            currentChatHistory.push({ role: "assistant", content: botA });

            let chat = allChats.find(c => c.id === currentChatId);
            if (!chat) {
                currentChatId = 'chat_' + Date.now();
                chat = {
                    id: currentChatId,
                    title: userQ.substring(0, 30) + (userQ.length > 30 ? '...' : ''),
                    messages: [],
                    date: new Date().toISOString()
                };
                allChats.unshift(chat);
            }

            chat.messages.push({ role: 'user', content: userQ, image: imageBase64 || null });
            chat.messages.push({ role: 'assistant', content: botA });

            // الاحتفاظ بآخر 5 محادثات فقط
            if (allChats.length > 5) {
                allChats = allChats.slice(0, 5);
            }

            saveChatsToStorage();
            renderHistoryList();
        }

        // ===== كود تثبيت التطبيق (PWA) =====
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            const installBtnHTML = `
                <div class="msg bot" id="installMsg" style="cursor:pointer;" onclick="installApp()">
                    <div class="msg-avatar"><i class="fas fa-download"></i></div>
                    <div class="msg-bubble" style="color: var(--primary); font-weight: bold;">
                        📲 اضغط هنا لتثبيت تطبيق ساهر AI على جهازك!
                    </div>
                </div>
            `;
            const chatArea = document.getElementById('chatArea');
            if (chatArea && !document.getElementById('installMsg')) {
                chatArea.insertAdjacentHTML('afterbegin', installBtnHTML);
            }
        });

        window.installApp = async function() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') {
                    console.log('تم تثبيت التطبيق');
                }
                deferredPrompt = null;
                const msg = document.getElementById('installMsg');
                if (msg) msg.remove();
            }
        };

        // ===== تسجيل Service Worker =====
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener("install", (e) => self.skipWaiting());
                self.addEventListener("activate", (e) => e.waitUntil(clients.claim()));
                self.addEventListener("fetch", (e) => {
                    if (e.request.method === "GET") e.respondWith(fetch(e.request));
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).then(() => {
                console.log('Service Worker registered successfully!');
            }).catch(err => console.error('SW failed:', err));
        }

        // ===== بدء التشغيل =====
        window.addEventListener('load', async () => {
            await loadDB();
            loadChatsFromStorage();
        });

    </script>
</body>
</html>
