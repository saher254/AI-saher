        .delete-history-btn:hover { opacity: 1; transform: scale(1.1); }

        .main-content { flex: 1; display: flex; flex-direction: column; height: 100%; position: relative; }
        .header { background: var(--bg-header); backdrop-filter: blur(15px); padding: 15px 20px; padding-top: calc(15px + env(safe-area-inset-top, 0px)); display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border-color); z-index: 10; }

        .theme-toggle-btn { background: rgba(255,255,255,0.1); border: 1px solid var(--border-color); color: var(--text-main); width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1); font-size: 1.1rem; overflow: hidden; }

        .input-container { width: 100%; max-width: 800px; margin: auto; display: flex; align-items: center; background: var(--bg-input); border-radius: 30px; border: 1px solid var(--border-color); padding: 5px 8px 5px 15px; transition: border-color 0.3s; backdrop-filter: blur(10px); }

        .action-btn.add-img-btn { background: transparent; border: none; color: var(--text-muted); font-size: 1.3rem; cursor: pointer; padding: 0 8px; transition: color 0.2s; flex-shrink: 0; }

        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 900; display: none; backdrop-filter: blur(3px); }

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAUmHcm0d0ErUph8l132llavVcUfwHWfic",
            authDomain: "gaming-platform-5ef6c.firebaseapp.com",
            projectId: "gaming-platform-5ef6c",
            storageBucket: "gaming-platform-5ef6c.firebasestorage.app",
            messagingSenderId: "332262507211",
            appId: "1:332262507211:web:dd51b094b7d3e4ab68914e"
        };
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const knowledgeCol = collection(db, "knowledge");

        let memory = [];
        let loadingDB = true;
        let selectedImageBase64 = null;
        
        let allChats = JSON.parse(localStorage.getItem('saher_chats_v6')) || [];
        let currentChatId = null;
        let currentChatHistory = [];

        const SYSTEM_PROMPT = `أنت "ساهر"، مساعد ذكاء اصطناعي ذكي جداً وودود.
        قواعدك:
        1. أول رسالة في أي محادثة جديدة، تقول: "أنا ساهر، هنا لمساعدتك!"
        2. لو حد سألك "مين انت" أو "من انت" أو "اسمك إيه"، ترد: "أنا ساهر، مساعدك الذكي."
        3. جاوب على أي سؤال يسأله المستخدم، سواء كان دراسي، عام، تقني، ثقافي، ديني، رياضي، أو ترفيهي.
        4. خليك مفيد ومباشر في إجاباتك، زي أفضل مساعد ذكاء اصطناعي في العالم.
        5. استخدم لغة عربية سليمة ومفهومة.
        6. لو السؤال مش واضح، اسأل المستخدم يوضح.
        7. إجاباتك تكون مختصرة وكافية.`;

        function normalize(t) { return t.toLowerCase().trim().replace(/[؟?!.,،؛:]/g, "").replace(/[إأآا]/g, "ا").replace(/ى/g, "ي").replace(/ة/g, "ه").replace(/\s+/g, " ").trim(); }
        const STOP = ["ما","هي","هو","هم","في","من","عن","على","الى","إلى","ايه","إيه","ال","هل","كان","كانت","يا","بس","دي","ده","دا","اللي"];
        function getWords(t) { return normalize(t).split(" ").filter(w => w && !STOP.includes(w)); }
        function wordSim(a, b) { if (a === b) return 1; if (a.length < 2 || b.length < 2) return 0; if (a.startsWith(b) || b.startsWith(a)) return 0.9; let common = 0; const bChars = b.split(""); for (let c of a) { const i = bChars.indexOf(c); if (i !== -1) { common++; bChars.splice(i, 1); } } return (2 * common) / (a.length + b.length); }
        function similarity(q1, q2) { if (normalize(q1) === normalize(q2)) return 1; const w1 = getWords(q1), w2 = getWords(q2); if (!w1.length || !w2.length) return 0; let m1 = 0; for (let a of w1) { let best = 0; for (let b of w2) best = Math.max(best, wordSim(a, b)); m1 += best; } const cov1 = m1 / w1.length; let m2 = 0; for (let b of w2) { let best = 0; for (let a of w1) best = Math.max(best, wordSim(b, a)); m2 += best; } const cov2 = m2 / w2.length; return (cov1 + cov2) / 2; }
        function findBestMatch(text) { let best = null, score = 0; for (let item of memory) { const s = similarity(text, item.question); if (s > score) { score = s; best = item; } } return (best && score >= 0.70) ? best : null; }

        async function loadDB() {
            try {
                const snap = await getDocs(knowledgeCol);
                memory = [];
                snap.forEach(d => { const data = d.data(); memory.push({ question: data.question || "", answer: data.answer || "" }); });
                loadingDB = false;
            } catch (e) { console.error("خطأ في Firebase:", e); loadingDB = false; }
        }

                window.toggleTheme = function() {
            const html = document.documentElement;
            const icon = document.getElementById('themeIcon');
            const btn = document.getElementById('themeBtn');
            btn.classList.add('animating');
            setTimeout(() => {
                if (html.getAttribute('data-theme') === 'night') {
                    html.setAttribute('data-theme', 'day');
                    icon.classList.replace('fa-moon', 'fa-sun');
                    localStorage.setItem('saher_theme', 'day');
                } else {
                    html.setAttribute('data-theme', 'night');
                    icon.classList.replace('fa-sun', 'fa-moon');
                    localStorage.setItem('saher_theme', 'night');
                }
                btn.classList.remove('animating');
            }, 250);
        }

        const savedTheme = localStorage.getItem('saher_theme') || 'night';
        document.documentElement.setAttribute('data-theme', savedTheme);
        if (savedTheme === 'day') {
            document.getElementById('themeIcon').classList.replace('fa-moon', 'fa-sun');
        }

        window.toggleSidebar = function() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('show');
        }

        function loadChatsFromStorage() {
            allChats = JSON.parse(localStorage.getItem('saher_chats_v6')) || [];
            renderHistoryList();
        }

        function saveChatsToStorage() {
            localStorage.setItem('saher_chats_v6', JSON.stringify(allChats));
        }

        function renderHistoryList() {
            const list = document.getElementById('chatHistoryList');
            list.innerHTML = '';
            if (allChats.length === 0) {
                list.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:0.85rem; margin-top:20px;">لا توجد محادثات سابقة</p>';
                return;
            }
            allChats.forEach(chat => {
                const div = document.createElement('div');
                div.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
                div.innerHTML = `
                    <span class="history-title" onclick="loadChat('${chat.id}')">${chat.title || 'محادثة بدون عنوان'}</span>
                    <button class="delete-history-btn" onclick="deleteChat(event, '${chat.id}')"><i class="fas fa-trash"></i></button>
                `;
                list.appendChild(div);
            });
        }

        window.deleteChat = function(e, id) {
            e.stopPropagation();
            if(confirm("هل تريد مسح هذه المحادثة من السجل؟")) {
                allChats = allChats.filter(c => c.id !== id);
                saveChatsToStorage();
                if (currentChatId === id) startNewChat();
                else renderHistoryList();
            }
        }

        window.loadChat = function(id) {
            const chat = allChats.find(c => c.id === id);
            if (!chat) return;
            currentChatId = id;
            currentChatHistory = chat.messages || [];
            const chatArea = document.getElementById('chatArea');
            chatArea.innerHTML = '';
            if (currentChatHistory.length > 0) {
                currentChatHistory.forEach(msg => {
                    if(msg.role === 'user') {
                        if (msg.image) addMessage(msg.image, true, true);
                        else addMessage(msg.content, true);
                    }
                    else addMessage(msg.content, false);
                });
            } else {
                chatArea.innerHTML = '<div class="welcome"><h2>المحادثة فارغة</h2></div>';
            }
            renderHistoryList();
            toggleSidebar();
        }

        window.startNewChat = function() {
            currentChatId = null;
            currentChatHistory = [];
            removeImagePreview();
            document.getElementById('chatArea').innerHTML = `
                <div class="welcome" id="welcomeScreen">
                    <div class="welcome-icon"><i class="fas fa-star"></i></div>
                    <h2>أهلاً بك في AI ساهر</h2>
                    <p>مساعدك الذكي الذي يتعلم منك ومن كل المستخدمين. اسألني أي حاجة في أي مجال، وأنا هحاول أجاوبك.</p>
                    <div class="suggestions">
                        <div class="suggestion-card" onclick="fillAndAsk('ما هي عاصمة مصر')"><i class="fas fa-lightbulb"></i> <span>ما هي عاصمة مصر</span></div>
                        <div class="suggestion-card" onclick="fillAndAsk('ازيك')"><i class="fas fa-lightbulb"></i> <span>ازيك</span></div>
                        <div class="suggestion-card" onclick="fillAndAsk('اشرحلي البرمجة ببساطة')"><i class="fas fa-lightbulb"></i> <span>اشرحلي البرمجة ببساطة</span></div>
                    </div>
                </div>
            `;
            renderHistoryList();
            if(document.getElementById('sidebar').classList.contains('open')) toggleSidebar();
        }

        function esc(t) { const d = document.createElement("div"); d.textContent = t; return d.innerHTML; }

        function addMessage(text, isUser, isImage = false) {
            const welcome = document.getElementById("welcomeScreen");
            if (welcome) welcome.remove();
            const chatArea = document.getElementById("chatArea");
            const div = document.createElement("div");
            div.className = "msg " + (isUser ? "user" : "bot");
            
            let bubbleContent = "";
            if (isImage) {
                bubbleContent = `<img src="${text}" class="chat-img">`;
            } else {
                bubbleContent = esc(text);
            }

            div.innerHTML = `
                <div class="msg-avatar"><i class="fas ${isUser ? 'fa-user' : 'fa-robot'}"></i></div>
                <div class="msg-bubble">${bubbleContent}</div>
            `;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function showTyping() {
            const chatArea = document.getElementById("chatArea");
            const div = document.createElement("div");
            div.className = "msg bot"; div.id = "typingMsg";
            div.innerHTML = `<div class="msg-avatar"><i class="fas fa-robot"></i></div><div class="typing"><span></span><span></span><span></span></div>`;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        function hideTyping() { const t = document.getElementById("typingMsg"); if (t) t.remove(); }

        window.fillAndAsk = function(text) {
            document.getElementById("userInput").value = text;
            ask();
        }

        window.handleImageSelect = function(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    selectedImageBase64 = e.target.result;
                    document.getElementById('imagePreviewImg').src = selectedImageBase64;
                    document.getElementById('imagePreviewBox').classList.add('active');
                };
                reader.readAsDataURL(input.files[0]);
            }
        };

        window.removeImagePreview = function() {
            selectedImageBase64 = null;
            document.getElementById('imageInput').value = '';
            document.getElementById('imagePreviewImg').src = '';
            document.getElementById('imagePreviewBox').classList.remove('active');
        };

        window.ask = async function() {
            const input = document.getElementById("userInput");
            const question = input.value.trim();
            
            if (!question && !selectedImageBase64) return;

            const finalQuestion = question || "اشرح لي هذه الصورة وحل أي واجب فيها";
            input.value = ""; // مسح خانة الكتابة فوراً
            
            const sendBtn = document.getElementById("sendBtn");
            sendBtn.disabled = true;

            if (selectedImageBase64) addMessage(selectedImageBase64, true, true);
            addMessage(finalQuestion, true);
            
            showTyping();
            let isImageQuery = selectedImageBase64 !== null;
            const imgToSave = selectedImageBase64;

            removeImagePreview();

            if (!isImageQuery && !loadingDB) {
                const match = findBestMatch(finalQuestion);
                if (match) {
                    setTimeout(() => {
                        hideTyping();
                        addMessage(match.answer, false);
                        saveChatToStorage(finalQuestion, match.answer);
                        sendBtn.disabled = false;
                    }, 300);
                    return;
                }
            }

            try {
                if (isImageQuery) {
                    const response = await puter.ai.chat(finalQuestion, imgToSave, { model: 'google/gemini-2.5-flash' });
                    hideTyping();
                    let aiReply = extractReply(response);
                    addMessage(aiReply, false);
                    saveChatToStorage("[📸 صورة] " + finalQuestion, aiReply, imgToSave);
                } else {
                    currentChatHistory.push({ role: "user", content: finalQuestion });
                    if (currentChatHistory.length > 10) currentChatHistory = currentChatHistory.slice(-10);
                    const messages = [ { role: "system", content: SYSTEM_PROMPT }, ...currentChatHistory ];
                    const response = await puter.ai.chat(messages, { model: 'google/gemini-2.5-flash' });
                    hideTyping();
                    let aiReply = extractReply(response);
                    addMessage(aiReply, false);
                    saveChatToStorage(finalQuestion, aiReply);
                }
            } catch (error) {
                hideTyping();
                console.error("❌ خطأ:", error);
                addMessage("عذراً، حصلت مشكلة في الاتصال. تأكد إنك سجلت الدخول وحاول تاني.", false);
            } finally {
                sendBtn.disabled = false;
            }
        }

        function extractReply(response) {
            if (typeof response === 'string') return response;
            if (response && response.message && response.message.content) {
                if (Array.isArray(response.message.content)) return response.message.content.map(c => c.text || "").join("");
                return response.message.content;
            }
            if (response && response.text) return response.text;
            return JSON.stringify(response);
        }

        function saveChatToStorage(userQ, botA, imageBase64 = null) {
            let userMessageObj = { role: "user", content: userQ };
            if (imageBase64) userMessageObj.image = imageBase64;
            
            currentChatHistory.push(userMessageObj);
            currentChatHistory.push({ role: "assistant", content: botA });

            let chat = allChats.find(c => c.id === currentChatId);
            if (!chat) {
                currentChatId = 'chat_' + Date.now();
                chat = {
                    id: currentChatId,
                    title: userQ.substring(0, 30) + (userQ.length > 30 ? '...' : ''),
                    messages: [],
                    date: new Date().toISOString()
                };
                allChats.unshift(chat);
            }

            chat.messages.push({ role: 'user', content: userQ, image: imageBase64 || null });
            chat.messages.push({ role: 'assistant', content: botA });

            // الاحتفاظ بآخر 5 محادثات فقط
            if (allChats.length > 5) {
                allChats = allChats.slice(0, 5);
            }

            saveChatsToStorage();
            renderHistoryList();
        }

    // ===== رسالة تثبيت التطبيق =====
let deferredPrompt;

window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredPrompt = e;

    // بنشوف لو المستخدم قفل الرسالة قبل كده
    const hasClosed = localStorage.getItem('saher_install_closed');
    
    if (!hasClosed) {
        // نعرض الرسالة بعد ثانيتين من فتح التطبيق
        setTimeout(() => {
            document.getElementById('installBanner').classList.add('show');
        }, 2000);
    }
});

window.installApp = async function() {
    if (deferredPrompt) {
        deferredPrompt.prompt();
        const { outcome } = await deferredPrompt.userChoice;
        
        if (outcome === 'accepted') {
            console.log('✅ تم تثبيت التطبيق');
            closeInstallBanner();
        }
        deferredPrompt = null;
    }
};

window.closeInstallBanner = function() {
    document.getElementById('installBanner').classList.remove('show');
    // بنحفظ إنه قفل الرسالة عشان متظهرش تاني
    localStorage.setItem('saher_install_closed', 'true');
};
        // ===== تسجيل Service Worker =====
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener("install", (e) => self.skipWaiting());
                self.addEventListener("activate", (e) => e.waitUntil(clients.claim()));
                self.addEventListener("fetch", (e) => {
                    if (e.request.method === "GET") e.respondWith(fetch(e.request));
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            const swUrl = URL.createObjectURL(blob);
            navigator.serviceWorker.register(swUrl).then(() => {
                console.log('Service Worker registered successfully!');
            }).catch(err => console.error('SW failed:', err));
        }

        // ===== بدء التشغيل =====
        window.addEventListener('load', async () => {
            await loadDB();
            loadChatsFromStorage();
        });

    </script>
