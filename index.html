<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ساهر</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Tajawal', Arial, sans-serif;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 100%;
            max-width: 750px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 5px;
            font-weight: 700;
            font-size: 2.2rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .subtitle span {
            background: #e0e7ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
            color: #4338ca;
        }

        h3 {
            color: #333;
            margin-top: 25px;
            margin-bottom: 10px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h3 i {
            font-style: normal;
            font-size: 1.2rem;
        }

        textarea, input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 16px;
            margin: 8px 0;
            border: 2px solid #e5e7eb;
            border-radius: 14px;
            font-size: 16px;
            background: #f9fafb;
            transition: all 0.2s;
            font-family: 'Tajawal', Arial, sans-serif;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: #6366f1;
            background: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-family: 'Tajawal', Arial, sans-serif;
        }

        button:active {
            transform: scale(0.98);
        }

        .learn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .learn:hover {
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .ask {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(17, 153, 142, 0.4);
        }

        .ask:hover {
            box-shadow: 0 8px 25px rgba(17, 153, 142, 0.6);
        }

        .save-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }

        .save-btn:hover {
            box-shadow: 0 8px 25px rgba(16, 185, 129, 0.6);
        }

        #answer {
            margin-top: 20px;
            padding: 20px;
            background: #f3f4f6;
            border-radius: 16px;
            min-height: 50px;
            font-size: 1.05rem;
            line-height: 1.7;
            color: #1f2937;
            border-right: 5px solid #6366f1;
            transition: all 0.3s;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            margin-left: 6px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* مودال تعليم النموذج */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: white;
            padding: 30px;
            border-radius: 24px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                opacity: 0;
                transform: translateY(-30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .modal h2 {
            text-align: center;
            color: #1a1a2e;
            margin-top: 0;
            margin-bottom: 5px;
        }

        .modal .modal-subtitle {
            text-align: center;
            color: #666;
            font-size: 0.9rem;
            margin-top: 0;
            margin-bottom: 20px;
        }

        .close-modal {
            background: #f3f4f6;
            color: #374151;
            margin-top: 10px;
        }

        .close-modal:hover {
            background: #e5e7eb;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c7d2fe;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a5b4fc;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🤖 AI ساهر</h1>
    <p class="subtitle">قاعدة معرفة مشتركة <span>مباشرة من السحابة <span class="status-dot"></span></span></p>

    <h3><i>💬</i> اسأل النموذج</h3>

    <input id="userQuestion" placeholder="اكتب سؤالك هنا">

    <button class="ask" onclick="ask()">
        🤖 اسأل AI ساهر
    </button>

    <div id="answer">
        مرحباً! أنا ساهر. اسألني أي شيء أو علّمني معلومة جديدة.
    </div>

    <button class="learn" onclick="openModal()">
        🧠 علّم النموذج
    </button>

</div>

<!-- مودال تعليم النموذج -->
<div class="modal-overlay" id="learnModal">
    <div class="modal">
        <h2>🧠 علّم النموذج</h2>
        <p class="modal-subtitle">أضف سؤالاً وإجابته، وستكون متاحة للجميع فوراً.</p>

        <input id="question" placeholder="اكتب السؤال الذي تريد تعليمي إياه">
        <textarea id="correctAnswer" placeholder="اكتب الإجابة الصحيحة"></textarea>

        <button class="save-btn" id="saveLearnBtn" onclick="learn()">
            💾 حفظ المعلومة في السحابة
        </button>

        <button class="close-modal" onclick="closeModal()">
            ✖️ إغلاق
        </button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAUmHcm0d0ErUph8l132llavVcUfwHWfic",
        authDomain: "gaming-platform-5ef6c.firebaseapp.com",
        projectId: "gaming-platform-5ef6c",
        storageBucket: "gaming-platform-5ef6c.firebasestorage.app",
        messagingSenderId: "332262507211",
        appId: "1:332262507211:web:dd51b094b7d3e4ab68914e",
        measurementId: "G-GVYDLMTY22"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const knowledgeCollection = collection(db, "knowledge");

    let memory = [];
    let isLoading = true;

    // ============ تنظيف النص ============
    function cleanText(text) {
        return text
            .toLowerCase()
            .trim()
            .replace(/[؟?!.,،؛]/g, "")
            .replace(/\s+/g, "");
    }

    // ============ حساب التشابه ============
    function similarity(text1, text2) {
        let clean1 = cleanText(text1);
        let clean2 = cleanText(text2);

        if (clean1 === clean2) return 1.0;

        let chars1 = clean1.split("");
        let chars2 = clean2.split("");

        if (chars1.length === 0 || chars2.length === 0) return 0;

        let common = 0;
        for (let char of chars1) {
            if (chars2.includes(char)) {
                common++;
            }
        }

        return (2 * common) / (chars1.length + chars2.length);
    }

    // ============ تحميل البيانات من Firestore ============
    async function loadKnowledge() {
        try {
            isLoading = true;
            const querySnapshot = await getDocs(knowledgeCollection);
            const newMemory = [];
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                newMemory.push({
                    id: doc.id,
                    question: data.question,
                    answer: data.answer
                });
            });
            memory = newMemory;
            isLoading = false;
        } catch (error) {
            console.error("خطأ في تحميل البيانات: ", error);
            isLoading = false;
        }
    }

    // ============ فتح وإغلاق المودال ============
    window.openModal = function() {
        document.getElementById("learnModal").classList.add("show");
        setTimeout(() => {
            document.getElementById("question").focus();
        }, 100);
    };

    window.closeModal = function() {
        document.getElementById("learnModal").classList.remove("show");
    };

    // إغلاق المودال عند الضغط خارجها
    document.getElementById("learnModal").addEventListener("click", function(e) {
        if (e.target === this) {
            closeModal();
        }
    });

    // إغلاق بزر Escape
    document.addEventListener("keydown", function(e) {
        if (e.key === "Escape") {
            closeModal();
        }
    });

    // ============ تعليم النموذج (حفظ في Firestore) ============
    window.learn = async function() {
        let question = document.getElementById("question").value.trim();
        let answer = document.getElementById("correctAnswer").value.trim();
        const btn = document.getElementById("saveLearnBtn");

        if (question === "" || answer === "") {
            alert("اكتب السؤال والإجابة أولًا");
            return;
        }

        if (isLoading) {
            alert("البيانات لا تزال قيد التحميل، يرجى الانتظار لحظة.");
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '⏳ جاري الحفظ...';

        try {
            const docRef = await addDoc(knowledgeCollection, {
                question: question,
                answer: answer,
                timestamp: new Date()
            });

            memory.push({
                id: docRef.id,
                question: question,
                answer: answer
            });

            document.getElementById("question").value = "";
            document.getElementById("correctAnswer").value = "";

            alert("🧠 تم تعليم النموذج وحفظ المعلومة في السحابة بنجاح!");
            closeModal();

        } catch (error) {
            console.error("خطأ في الحفظ: ", error);
            alert("حدث خطأ أثناء الحفظ. تأكد من اتصالك بالإنترنت وإعدادات Firestore.");
        } finally {
            btn.disabled = false;
            btn.innerHTML = '💾 حفظ المعلومة في السحابة';
        }
    };

    // ============ السؤال ============
    window.ask = function() {
        let question = document.getElementById("userQuestion").value.trim();

        if (question === "") {
            alert("اكتب سؤالًا أولًا");
            return;
        }

        if (isLoading) {
            document.getElementById("answer").innerText = "🤖 جاري تحميل قاعدة المعرفة، يرجى الانتظار...";
            return;
        }

        const answerDiv = document.getElementById("answer");

        // دعم العمليات الحسابية المباشرة
        let cleanMath = question.replace(/\s+/g, "").replace(/×/g, "*").replace(/÷/g, "/");
        if (/^[0-9]+[\+\-\*\/][0-9]+$/.test(cleanMath)) {
            try {
                let result = eval(cleanMath);
                answerDiv.innerText = `🤖 ناتج العملية الحسابية هو: ${result}`;
                return;
            } catch (e) {}
        }

        if (memory.length === 0) {
            answerDiv.innerText = "🤖 قاعدة البيانات فارغة حالياً. قم بتعليمي أول معلومة!";
            return;
        }

        let best = null;
        let bestScore = 0;

        for (let item of memory) {
            let score = similarity(question, item.question);
            if (score > bestScore) {
                bestScore = score;
                best = item;
            }
        }

        if (best && bestScore >= 0.75) {
            answerDiv.innerText = "🤖 " + best.answer;
        } else {
            answerDiv.innerText = "🤖 برمجني على هذه المعلومات أولاً لأن ساهر لم يخبرني بهذا 😅";
        }
    };

    // ============ تشغيل ============
    loadKnowledge();
</script>

</body>
</html>
