<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ساهر</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * { font-family: 'Tajawal', Arial, sans-serif; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            margin: 0; padding: 20px; min-height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        .box {
            width: 100%; max-width: 750px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        h1 {
            text-align: center; color: #1a1a2e;
            margin-bottom: 5px; font-weight: 700; font-size: 2.2rem;
        }

        .subtitle {
            text-align: center; color: #666;
            margin-top: 0; margin-bottom: 25px; font-size: 0.95rem;
        }

        .subtitle span {
            background: #e0e7ff; padding: 4px 12px;
            border-radius: 20px; font-weight: 500; color: #4338ca;
        }

        h3 {
            color: #333; margin-top: 25px; margin-bottom: 10px;
            font-weight: 500; display: flex; align-items: center; gap: 8px;
        }

        h3 i { font-style: normal; font-size: 1.2rem; }

        textarea, input {
            width: 100%; box-sizing: border-box;
            padding: 14px 16px; margin: 8px 0;
            border: 2px solid #e5e7eb; border-radius: 14px;
            font-size: 16px; background: #f9fafb;
            transition: all 0.2s;
            font-family: 'Tajawal', Arial, sans-serif;
        }

        textarea:focus, input:focus {
            outline: none; border-color: #6366f1; background: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        textarea { resize: vertical; min-height: 80px; }

        button {
            width: 100%; padding: 15px; margin: 8px 0;
            border: none; border-radius: 14px;
            font-size: 17px; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
            display: flex; justify-content: center; align-items: center; gap: 10px;
            font-family: 'Tajawal', Arial, sans-serif;
        }

        button:active { transform: scale(0.98); }

        .learn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .learn:hover { box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6); }

        .ask {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(17, 153, 142, 0.4);
        }
        .ask:hover { box-shadow: 0 8px 25px rgba(17, 153, 142, 0.6); }

        .save-btn {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
        }
        .save-btn:hover { box-shadow: 0 8px 25px rgba(16, 185, 129, 0.6); }

        #answer {
            margin-top: 20px; padding: 20px;
            background: #f3f4f6; border-radius: 16px;
            min-height: 50px; font-size: 1.05rem; line-height: 1.7;
            color: #1f2937; border-right: 5px solid #6366f1;
            transition: all 0.3s;
            white-space: pre-wrap; word-wrap: break-word;
        }

        .status-dot {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; background: #10b981;
            margin-left: 6px; animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        .modal-overlay {
            display: none; position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center; align-items: center; padding: 20px;
        }

        .modal-overlay.show { display: flex; }

        .modal {
            background: white; padding: 30px;
            border-radius: 24px; width: 100%; max-width: 550px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from { opacity: 0; transform: translateY(-30px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .modal h2 {
            text-align: center; color: #1a1a2e;
            margin-top: 0; margin-bottom: 5px;
        }

        .modal .modal-subtitle {
            text-align: center; color: #666;
            font-size: 0.9rem; margin-top: 0; margin-bottom: 20px;
        }

        .close-modal {
            background: #f3f4f6; color: #374151; margin-top: 10px;
        }
        .close-modal:hover { background: #e5e7eb; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #c7d2fe; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #a5b4fc; }
    </style>
</head>

<body>

<div class="box">

    <h1>🤖 AI ساهر</h1>
    <p class="subtitle">قاعدة معرفة مشتركة <span>مباشرة من السحابة <span class="status-dot"></span></span></p>

    <h3><i>💬</i> اسأل النموذج</h3>

    <input id="userQuestion" placeholder="اكتب سؤالك هنا">

    <button class="ask" onclick="ask()">
        🤖 اسأل AI ساهر
    </button>

    <div id="answer">
        مرحباً! أنا ساهر. اسألني أي شيء أو علّمني معلومة جديدة.
    </div>

    <button class="learn" onclick="openModal()">
        🧠 علّم النموذج
    </button>

</div>

<div class="modal-overlay" id="learnModal">
    <div class="modal">
        <h2>🧠 علّم النموذج</h2>
        <p class="modal-subtitle">أضف سؤالاً وإجابته، وستكون متاحة للجميع فوراً.</p>

        <input id="question" placeholder="اكتب السؤال الذي تريد تعليمي إياه">
        <textarea id="correctAnswer" placeholder="اكتب الإجابة الصحيحة"></textarea>

        <button class="save-btn" id="saveLearnBtn" onclick="learn()">
            💾 حفظ المعلومة في السحابة
        </button>

        <button class="close-modal" onclick="closeModal()">
            ✖️ إغلاق
        </button>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAUmHcm0d0ErUph8l132llavVcUfwHWfic",
        authDomain: "gaming-platform-5ef6c.firebaseapp.com",
        projectId: "gaming-platform-5ef6c",
        storageBucket: "gaming-platform-5ef6c.firebasestorage.app",
        messagingSenderId: "332262507211",
        appId: "1:332262507211:web:dd51b094b7d3e4ab68914e",
        measurementId: "G-GVYDLMTY22"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const knowledgeCollection = collection(db, "knowledge");

    let memory = [];
    let isLoading = true;

    // ============ كلمات الحشو اللي تتشال قبل المقارنة ============
    const STOP_WORDS = [
        "ما", "هي", "هو", "هم", "في", "من", "عن", "على", "الى", "إلى",
        "ايه", "إيه", "ال", "هل", "كان", "كانت", "يكون", "تكون",
        "يا", "بس", "دي", "ده", "دا", "اللي", "التي", "الذي"
    ];

    // ============ تنظيف النص وتقسيمه لكلمات ============
    function normalizeText(text) {
        return text
            .toLowerCase()
            .trim()
            .replace(/[؟?!.,،؛:]/g, "")
            .replace(/[إأآا]/g, "ا")   // توحيد الألف
            .replace(/ى/g, "ي")        // توحيد الياء
            .replace(/ة/g, "ه")        // توحيد التاء المربوطة
            .replace(/\s+/g, " ")
            .trim();
    }

    function getWords(text) {
        const normalized = normalizeText(text);
        return normalized
            .split(" ")
            .filter(w => w.length > 0 && !STOP_WORDS.includes(w));
    }

    // ============ مطابقة تامة ============
    function exactMatch(q1, q2) {
        return normalizeText(q1) === normalizeText(q2);
    }

    // ============ حساب التشابه بين كلمتين (Levenshtein مبسط) ============
    function wordSimilarity(w1, w2) {
        if (w1 === w2) return 1;
        if (w1.length < 2 || w2.length < 2) return 0;

        // لو واحدة بتبدأ بالتانية أو العكس
        if (w1.startsWith(w2) || w2.startsWith(w1)) return 0.9;

        // حساب الحروف المشتركة
        let common = 0;
        const w2Chars = w2.split("");
        for (let ch of w1) {
            const idx = w2Chars.indexOf(ch);
            if (idx !== -1) {
                common++;
                w2Chars.splice(idx, 1);
            }
        }
        return (2 * common) / (w1.length + w2.length);
    }

    // ============ حساب نسبة تطابق السؤال بكلمة بكلمة ============
    function questionSimilarity(userQ, storedQ) {
        // 1. مطابقة تامة
        if (exactMatch(userQ, storedQ)) return 1.0;

        const userWords = getWords(userQ);
        const storedWords = getWords(storedQ);

        if (userWords.length === 0 || storedWords.length === 0) return 0;

        // 2. نحسب لكل كلمة في سؤال المستخدم: هل فيه كلمة مطابقة في السؤال المخزن؟
        let matchedWeight = 0;
        let totalWeight = userWords.length;

        for (let uw of userWords) {
            let bestWordScore = 0;
            for (let sw of storedWords) {
                const score = wordSimilarity(uw, sw);
                if (score > bestWordScore) bestWordScore = score;
            }
            matchedWeight += bestWordScore;
        }

        // 3. نسبة التطابق من جهة المستخدم
        const userCoverage = matchedWeight / totalWeight;

        // 4. نسبة التطابق من جهة السؤال المخزن (عشان نمنع الردود اللي فيها كلمات زيادة كتير)
        let storedMatchedWeight = 0;
        for (let sw of storedWords) {
            let bestWordScore = 0;
            for (let uw of userWords) {
                const score = wordSimilarity(sw, uw);
                if (score > bestWordScore) bestWordScore = score;
            }
            storedMatchedWeight += bestWordScore;
        }
        const storedCoverage = storedMatchedWeight / storedWords.length;

        // 5. النسبة النهائية = متوسط الاتنين (لازم الاتنين يكونوا كويسين)
        return (userCoverage + storedCoverage) / 2;
    }

    // ============ تحميل البيانات ============
    async function loadKnowledge() {
        try {
            isLoading = true;
            const querySnapshot = await getDocs(knowledgeCollection);
            const newMemory = [];
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                newMemory.push({
                    id: doc.id,
                    question: data.question,
                    answer: data.answer
                });
            });
            memory = newMemory;
            isLoading = false;
            console.log(`تم تحميل ${memory.length} معلومة من السحابة.`);
        } catch (error) {
            console.error("خطأ في تحميل البيانات: ", error);
            isLoading = false;
        }
    }

    // ============ فتح/إغلاق المودال ============
    window.openModal = function() {
        document.getElementById("learnModal").classList.add("show");
        setTimeout(() => document.getElementById("question").focus(), 100);
    };

    window.closeModal = function() {
        document.getElementById("learnModal").classList.remove("show");
    };

    document.getElementById("learnModal").addEventListener("click", function(e) {
        if (e.target === this) closeModal();
    });

    document.addEventListener("keydown", function(e) {
        if (e.key === "Escape") closeModal();
    });

    // ============ تعليم النموذج ============
    window.learn = async function() {
        let question = document.getElementById("question").value.trim();
        let answer = document.getElementById("correctAnswer").value.trim();
        const btn = document.getElementById("saveLearnBtn");

        if (question === "" || answer === "") {
            alert("اكتب السؤال والإجابة أولًا");
            return;
        }

        if (isLoading) {
            alert("البيانات لا تزال قيد التحميل، يرجى الانتظار لحظة.");
            return;
        }

        btn.disabled = true;
        btn.innerHTML = '⏳ جاري الحفظ...';

        try {
            const docRef = await addDoc(knowledgeCollection, {
                question: question,
                answer: answer,
                timestamp: new Date()
            });

            memory.push({
                id: docRef.id,
                question: question,
                answer: answer
            });

            document.getElementById("question").value = "";
            document.getElementById("correctAnswer").value = "";

            alert("🧠 تم تعليم النموذج وحفظ المعلومة في السحابة بنجاح!");
            closeModal();

        } catch (error) {
            console.error("خطأ في الحفظ: ", error);
            alert("حدث خطأ أثناء الحفظ. تأكد من اتصالك بالإنترنت وإعدادات Firestore.");
        } finally {
            btn.disabled = false;
            btn.innerHTML = '💾 حفظ المعلومة في السحابة';
        }
    };

    // ============ السؤال (البحث الذكي) ============
    // ============ السؤال (البحث الذكي + دعم أسئلة متعددة) ============
window.ask = function() {
    let question = document.getElementById("userQuestion").value.trim();

    if (question === "") {
        alert("اكتب سؤالًا أولًا");
        return;
    }

    if (isLoading) {
        document.getElementById("answer").innerText = "🤖 جاري تحميل قاعدة المعرفة، يرجى الانتظار...";
        return;
    }

    const answerDiv = document.getElementById("answer");

    // 1. العمليات الحسابية المباشرة
    let cleanMath = question.replace(/\s+/g, "").replace(/×/g, "*").replace(/÷/g, "/");
    if (/^[0-9]+[\+\-\*\/][0-9]+$/.test(cleanMath)) {
        try {
            let result = eval(cleanMath);
            answerDiv.innerText = `🤖 ناتج العملية الحسابية هو: ${result}`;
            return;
        } catch (e) {}
    }

    if (memory.length === 0) {
        answerDiv.innerText = "🤖 قاعدة البيانات فارغة حالياً. قم بتعليمي أول معلومة!";
        return;
    }

    // 2. تقسيم السؤال لأجزاء لو فيه أسئلة متعددة
    const parts = splitMultipleQuestions(question);

    // لو جزء واحد → البحث العادي
    if (parts.length === 1) {
        const result = findBestMatch(question);
        if (result && result.score >= 0.70) {
            answerDiv.innerText = "🤖 " + result.answer;
        } else {
            answerDiv.innerText = "🤖 برمجني على هذه المعلومات أولاً لأن ساهر لم يخبرني بهذا 😅";
        }
        if (result) {
            console.log(`أفضل تطابق: "${result.question}" بنسبة ${(result.score * 100).toFixed(1)}%`);
        }
        return;
    }

    // 3. لو أجزاء متعددة → ندوّر على كل جزء ونلم النتايج
    const results = [];
    for (let part of parts) {
        const result = findBestMatch(part);
        if (result && result.score >= 0.70) {
            results.push({ part: part, answer: result.answer, found: true });
        } else {
            results.push({ part: part, answer: null, found: false });
        }
    }

    // 4. نبني الرد
    const foundResults = results.filter(r => r.found);
    const notFoundResults = results.filter(r => !r.found);

    if (foundResults.length === 0) {
        answerDiv.innerText = "🤖 برمجني على هذه المعلومات أولاً لأن ساهر لم يخبرني بهذا 😅";
    } else if (notFoundResults.length === 0) {
        // لقى كل حاجة → يجمع الإجابات
        let response = "🤖 إليك الإجابات:\n\n";
        foundResults.forEach((r, i) => {
            response += `${i + 1}. ${r.answer}\n`;
        });
        answerDiv.innerText = response.trim();
    } else {
        // لقى بعض الحاجات بس
        let response = "🤖 إليك ما أعرفه:\n\n";
        foundResults.forEach((r, i) => {
            response += `${i + 1}. ${r.answer}\n`;
        });
        response += "\n❓ أما عن: ";
        response += notFoundResults.map(r => `"${r.part}"`).join(" و ");
        response += " — فبرمجني عليه أولاً 😅";
        answerDiv.innerText = response;
    }
};

// ============ تقسيم السؤال لأجزاء متعددة (نسخة ذكية) ============
function splitMultipleQuestions(question) {
    let q = question.replace(/\s+/g, " ").trim();

    // نبحث عن فواصل العطف
    const separators = [
        / و(?=\S)/g,
        / أو(?=\S)/g,
        / ثم(?=\S)/g,
        / بعدين(?=\S)/g,
        /[،,]/g,
    ];

    // نقسم مبدئيًا
    let parts = [q];
    for (let sep of separators) {
        const newParts = [];
        for (let part of parts) {
            const split = part.split(sep).map(s => s.trim()).filter(s => s.length > 0);
            newParts.push(...split);
        }
        parts = newParts;
    }

    parts = parts.filter(p => p.length >= 2);

    if (parts.length <= 1) return [question];
    if (parts.length > 5) return [question];

    // ✨ الذكاء: ناخد البادئة المشتركة من الجزء الأول ونطبقها على الباقي
    const firstPart = parts[0];
    const firstWords = firstPart.split(" ");

    let prefix = "";
    if (firstWords.length >= 2) {
        prefix = firstWords.slice(0, -1).join(" ");
    }

    const rebuilt = parts.map((part, idx) => {
        if (idx === 0) return part;
        if (prefix && !part.startsWith(prefix)) {
            return prefix + " " + part;
        }
        return part;
    });

    return rebuilt;
}

// ============ البحث عن أفضل تطابق (دالة مساعدة) ============
function findBestMatch(questionText) {
    let best = null;
    let bestScore = 0;

    for (let item of memory) {
        const score = questionSimilarity(questionText, item.question);
        if (score > bestScore) {
            bestScore = score;
            best = item;
        }
    }

    return best ? { ...best, score: bestScore } : null;
}

// ============ تشغيل ============
loadKnowledge();
</script>

</body>
</html>
