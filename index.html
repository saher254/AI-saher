<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI برمج بنفسي ساهر</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .box {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 15px #bbb;
        }

        h1 {
            text-align: center;
        }

        textarea, input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #aaa;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin: 6px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .learn {
            background: #2196f3;
            color: white;
        }

        .ask {
            background: #4caf50;
            color: white;
        }

        .clear {
            background: #f44336;
            color: white;
        }

        #answer {
            margin-top: 15px;
            padding: 15px;
            background: #eee;
            border-radius: 10px;
            min-height: 30px;
        }

        #count {
            text-align: center;
            color: #555;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🤖 AI من الصفر</h1>

    <p>
        النموذج لا يحتوي على معلومات جاهزة.
        أنت الذي تعلّمه.
    </p>

    <h3>📚 تدريب النموذج</h3>

    <input id="question"
           placeholder="اكتب السؤال الذي تريد تعليمي إياه">

    <textarea id="correctAnswer"
              placeholder="اكتب الإجابة الصحيحة"></textarea>

    <button class="learn" onclick="learn()">
        🧠 علّم النموذج
    </button>

    <h3>💬 اسأل النموذج</h3>

    <input id="userQuestion"
           placeholder="اكتب سؤالك هنا">

    <button class="ask" onclick="ask()">
        🤖 اسأل AI
    </button>

    <div id="answer">
        لم تسأل النموذج بعد.
    </div>

    <p id="count">
        عدد المعلومات التي تعلمها: 0
    </p>

    <button class="clear" onclick="clearMemory()">
        🗑️ مسح كل ما تعلمه
    </button>

</div>

<script>

    const initialKnowledge = [
        // --- أسئلة عامة وبرمجية ---
        { "question": "ما هي عاصمة مصر", "answer": "عاصمة مصر هي القاهرة." },
        { "question": "ما هي عاصمة السعودية", "answer": "عاصمة السعودية هي الرياض." },
        { "question": "ما هي عاصمة الإمارات", "answer": "عاصمة الإمارات هي أبوظبي." },
        { "question": "ما هي البرمجة", "answer": "البرمجة هي عملية كتابة تعليمات وأوامر للحاسوب لتنفيذ مهام محددة باستخدام لغات برمجة." },
        { "question": "ما هي لغة جافاسكريبت", "answer": "هي لغة برمجة عالية المستوى تُستخدم أساساً لإضافة التفاعلية والحيوية لصفحات الويب." },
        { "question": "ما هي لغة جافاسكريبت javascript", "answer": "هي لغة برمجة عالية المستوى تُستخدم أساساً لإضافة التفاعلية والحيوية لصفحات الويب." },
        { "question": "ما الفرق بين let و const في جافاسكريبت", "answer": "let تسمح بتغيير قيمة المتغير لاحقاً، بينما const تُستخدم للمتغيرات الثابتة التي لا تتغير قيمتها." },
        { "question": "ما هي قواعد البيانات DBMS", "answer": "أنظمة إدارة قواعد البيانات تُستخدم لتنظيم وتخزين واسترجاع البيانات بفعالية مثل MySQL." },
        { "question": "ما هو المفتاح الرئيسي Primary Key في قواعد البيانات", "answer": "هو حقل فريد يحدد كل سجل في الجدول بشكل لا يتكرر ولا يقبل قيمة فارغة." },
        { "question": "ما هي لغة SQL", "answer": "هي لغة الاستعلام الهيكلية تُستخدم للتعامل مع قواعد البيانات وتحديثها والاستعلام عنها." },
        { "question": "ما هو بروتوكول HTTP", "answer": "هو بروتوكول نقل النص الفائق المستخدم لنقل صفحات الويب بين الخادم والمتصفح." }
    ];

    // ==========================================
    // إضافة جميع عواصم العالم والمدن الرئيسية سؤال وجواب
    // ==========================================
    const worldCapitals = [
        ["مصر", "القاهرة"], ["السعودية", "الرياض"], ["الإمارات", "أبوظبي"], ["الكويت", "مدينة الكويت"],
        ["قطر", "الدوحة"], ["البحرين", "المنامة"], ["سلطنة عمان", "مسقط"], ["الأردن", "عمان"],
        ["فلسطين", "القدس الشريف"], ["لبنان", "بيروت"], ["سوريا", "دمشق"], ["العراق", "بغداد"],
        ["المغرب", "الرباط"], ["الجزائر", "الجزائر العاصمة"], ["تونس", "تونس"], ["ليبيا", "طرابلس"],
        ["السودان", "الخرطوم"], ["اليمن", "صنعاء"], ["الصومال", "مقديشو"], ["جيبوتي", "جيبوتي"],
        ["موريتانيا", "نواكشوط"], ["جزر القمر", "מורوني"], ["فرنسا", "باريس"], ["ألمانيا", "برلين"],
        ["إيطاليا", "روما"], ["المملكة المتحدة", "لندن"], ["الولايات المتحدة", "واشنطن العاصمة"],
        ["الصين", "بكين"], ["اليابان", "طوكيو"], ["روسيا", "موسكو"], ["تركيا", "أنقرة"],
        ["إسبانيا", "مدريد"], ["كندا", "أوتاوا"], ["أستراليا", "كانبرا"], ["البرتغال", "لشبونة"],
        ["اليونان", "أثينا"], ["هولندا", "أمستردام"], ["بلجيكا", "بروكسل"], ["السويد", "ستوكهولم"],
        ["النرويج", "أوسلو"], ["سويسرا", "برن"], ["النمسا", "فيينا"], ["الهند", "نيودلهي"],
        ["باكستان", "إسلام آباد"], ["إيران", "طهران"], ["كوريا الجنوبية", "سيول"], ["البرازيل", "برازيليا"],
        ["الأرجنتين", "بوينس آيرس"], ["جنوب أفريقيا", "بريتوريا"]
    ];

    worldCapitals.forEach(item => {
        initialKnowledge.push({ "question": `ما هي عاصمة ${item[0]}`, "answer": `عاصمة ${item[0]} هي ${item[1]}.` });
        initialKnowledge.push({ "question": `عاصمة ${item[0]}`, "answer": `عاصمة ${item[0]} هي ${item[1]}.` });
        initialKnowledge.push({ "question": `ما عاصمة ${item[0]}`, "answer": `عاصمة ${item[0]} هي ${item[1]}.` });
    });

    // ==========================================
    // توليد كافة العمليات الحسابية الشاملة بالرموز والعربي
    // ==========================================
    for (let i = 1; i <= 100; i++) {
        initialKnowledge.push({ "question": `${i}+${i}`, "answer": `حاصل جمع ${i} + ${i} يساوي ${i+i}.` });
        initialKnowledge.push({ "question": `${i}*${i}`, "answer": `حاصل ضرب ${i} × ${i} يساوي ${i*i}.` });
        initialKnowledge.push({ "question": `${i*2}-${i}`, "answer": `حاصل طرح ${i} من ${i*2} يساوي ${i}.` });
        initialKnowledge.push({ "question": `${i*2}/${2}`, "answer": `ناتج قسمة ${i*2} على 2 يساوي ${i}.` });

        initialKnowledge.push({ "question": `ما هو حاصل ضرب ${i} في ${i}`, "answer": `حاصل ضرب ${i} في ${i} يساوي ${i*i}.` });
        initialKnowledge.push({ "question": `ما هو مجموع ${i} زائد ${i}`, "answer": `مجموع ${i} زائد ${i} يساوي ${i+i}.` });
        initialKnowledge.push({ "question": `ما هو حاصل طرح ${i} من ${i*2}`, "answer": `حاصل طرح ${i} من ${i*2} يساوي ${i}.` });
        initialKnowledge.push({ "question": `ما هو ناتج قسمة ${i*2} على 2`, "answer": `ناتج قسمة ${i*2} على 2 يساوي ${i}.` });
        initialKnowledge.push({ "question": `ما هو مربع العدد ${i}`, "answer": `مربع العدد ${i} يساوي ${i*i}.` });
        initialKnowledge.push({ "question": `ما هو الجذر التربيعي للعدد ${i*i}`, "answer": `الجذر التربيعي للعدد ${i*i} يساوي ${i}.` });
        initialKnowledge.push({ "question": `ما هي نسبة ${i} بالمئة من 100`, "answer": `نسبة ${i}% من 100 تساوي ${i}.` });
        initialKnowledge.push({ "question": `ما هو باقي قسمة ${i} على 2`, "answer": `باقي قسمة ${i} على 2 هو ${i % 2}.` });

        if (i <= 20) {
            for (let j = 1; j <= 20; j++) {
                initialKnowledge.push({ "question": `${i}+${j}`, "answer": `ناتج ${i} + ${j} يساوي ${i + j}.` });
                initialKnowledge.push({ "question": `${i}-${j}`, "answer": `ناتج ${i} - ${j} يساوي ${i - j}.` });
                initialKnowledge.push({ "question": `${i}*${j}`, "answer": `ناتج ${i} × ${j} يساوي ${i * j}.` });
                initialKnowledge.push({ "question": `كم يساوي ${i} زائد ${j}`, "answer": `ناتج ${i} + ${j} يساوي ${i + j}.` });
                initialKnowledge.push({ "question": `كم يساوي ${i} ناقص ${j}`, "answer": `ناتج ${i} - ${j} يساوي ${i - j}.` });
                initialKnowledge.push({ "question": `كم يساوي ${i} في ${j}`, "answer": `ناتج ${i} × ${j} يساوي ${i * j}.` });
            }
        }
    }

    const chemElements = [
        ["الهيدروجين", "H", 1], ["الهيليوم", "He", 2], ["الليثيوم", "Li", 3], ["الكربون", "C", 6],
        ["النيتروجين", "N", 7], ["الأكسجين", "O", 8], ["الصوديوم", "Na", 11], ["الحديد", "Fe", 26],
        ["النحاس", "Cu", 29], ["الذهب", "Au", 79], ["الفضة", "Ag", 47]
    ];

    chemElements.forEach(elem => {
        initialKnowledge.push({ "question": `ما هو الرمز الكيميائي للعنصر ${elem[0]}`, "answer": `الرمز الكيميائي لـ ${elem[0]} هو ${elem[1]}.` });
        initialKnowledge.push({ "question": `ما هو العدد الذري للعنصر ${elem[0]}`, "answer": `العدد الذري لـ ${elem[0]} هو ${elem[2]}.` });
    });

    let memory = JSON.parse(
        localStorage.getItem("myAI_memory")
    ) || initialKnowledge;

    function cleanText(text) {
        return text
            .toLowerCase()
            .trim()
            .replace(/[؟?!.,،؛]/g, "")
            .replace(/\s+/g, "");
    }

    function learn() {
        let question = document.getElementById("question").value.trim();
        let answer = document.getElementById("correctAnswer").value.trim();

        if (question === "" || answer === "") {
            alert("اكتب السؤال والإجابة أولًا");
            return;
        }

        let cleanQuestion = cleanText(question);
        let old = memory.find(item => cleanText(item.question) === cleanQuestion);

        if (old) {
            old.answer = answer;
        } else {
            memory.push({
                question: question,
                answer: answer
            });
        }

        localStorage.setItem("myAI_memory", JSON.stringify(memory));

        document.getElementById("question").value = "";
        document.getElementById("correctAnswer").value = "";

        updateCount();
        alert("🧠 تم تعليم النموذج!");
    }

    function similarity(text1, text2) {
        let clean1 = cleanText(text1);
        let clean2 = cleanText(text2);

        if (clean1 === clean2) return 1.0;

        let words1 = clean1.split("");
        let words2 = clean2.split("");

        if (words1.length === 0 || words2.length === 0) return 0;

        let common = 0;
        for (let char of words1) {
            if (words2.includes(char)) {
                common++;
            }
        }

        return (2 * common) / (words1.length + words2.length);
    }

    function ask() {
        let question = document.getElementById("userQuestion").value.trim();

        if (question === "") {
            alert("اكتب سؤالًا أولًا");
            return;
        }

        // دعم إضافي للعمليات الحسابية المباشرة عبر الرموز
        let cleanMath = question.replace(/\s+/g, "").replace(/×/g, "*").replace(/÷/g, "/");
        if (/^[0-9]+[\+\-\*\/][0-9]+$/.test(cleanMath)) {
            try {
                let result = eval(cleanMath);
                document.getElementById("answer").innerText = `🤖 ناتج العملية الحسابية هو: ${result}`;
                return;
            } catch (e) {}
        }

        if (memory.length === 0) {
            document.getElementById("answer").innerText = "🤖 برمجني الأول";
            return;
        }

        let best = null;
        let bestScore = 0;

        for (let item of memory) {
            let score = similarity(question, item.question);
            if (score > bestScore) {
                bestScore = score;
                best = item;
            }
        }

        if (best && bestScore >= 0.75) {
            document.getElementById("answer").innerText = "🤖 " + best.answer;
        } else {
            document.getElementById("answer").innerText = "🤖 برمجني على هذه المعلومات اولا لان ساهر لم يخبرني بهذا 😅";
        }
    }

    function updateCount() {
        document.getElementById("count").innerText =
            "عدد المعلومات التي تعلمها: " + memory.length;
    }

    function clearMemory() {
        let confirmDelete = confirm("هل تريد مسح كل المعلومات التي تعلمها النموذج؟");

        if (confirmDelete) {
            memory = [];
            localStorage.removeItem("myAI_memory");
            updateCount();
            document.getElementById("answer").innerText = "🤖 تم مسح الذاكرة برمجني الأول";
        }
    }

    updateCount();

</script>

</body>
</html>
