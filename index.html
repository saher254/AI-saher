<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI ساهر - النسخة السحابية</title>

    <!-- استيراد خط تجوال من جوجل -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        * {
            font-family: 'Tajawal', Arial, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .box {
            width: 100%;
            max-width: 750px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s ease;
        }

        h1 {
            text-align: center;
            color: #1a1a2e;
            margin-bottom: 5px;
            font-weight: 700;
            font-size: 2.2rem;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .subtitle span {
            background: #e0e7ff;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 500;
            color: #4338ca;
        }

        h3 {
            color: #333;
            margin-top: 25px;
            margin-bottom: 10px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h3 i {
            font-style: normal;
            font-size: 1.2rem;
        }

        textarea, input {
            width: 100%;
            box-sizing: border-box;
            padding: 14px 16px;
            margin: 8px 0;
            border: 2px solid #e5e7eb;
            border-radius: 14px;
            font-size: 16px;
            background: #f9fafb;
            transition: all 0.2s;
            font-family: 'Tajawal', Arial, sans-serif;
        }

        textarea:focus, input:focus {
            outline: none;
            border-color: #6366f1;
            background: white;
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 80px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border: none;
            border-radius: 14px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            font-family: 'Tajawal', Arial, sans-serif;
        }

        button:active {
            transform: scale(0.98);
        }

        .learn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .learn:hover {
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .ask {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(17, 153, 142, 0.4);
        }

        .ask:hover {
            box-shadow: 0 8px 25px rgba(17, 153, 142, 0.6);
        }

        .clear {
            background: #fee2e2;
            color: #dc2626;
            border: 2px solid #fecaca;
            margin-top: 15px;
        }

        .clear:hover {
            background: #fecaca;
            color: #b91c1c;
        }

        #answer {
            margin-top: 20px;
            padding: 20px;
            background: #f3f4f6;
            border-radius: 16px;
            min-height: 50px;
            font-size: 1.05rem;
            line-height: 1.7;
            color: #1f2937;
            border-right: 5px solid #6366f1;
            transition: all 0.3s;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        #count {
            text-align: center;
            color: #6b7280;
            font-size: 0.9rem;
            margin-top: 20px;
            padding: 10px;
            background: #f9fafb;
            border-radius: 12px;
        }

        #count span {
            font-weight: 700;
            color: #6366f1;
            font-size: 1.1rem;
        }

        .status-dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            margin-left: 6px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }

        /* شريط التمرير المخصص */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c7d2fe;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a5b4fc;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🤖 AI ساهر</h1>
    <p class="subtitle">قاعدة معرفة مشتركة <span>مباشرة من السحابة <span class="status-dot"></span></span></p>

    <h3><i>📚</i> تدريب النموذج</h3>
    <p style="font-size: 0.85rem; color: #888; margin-top: -5px;">أضف سؤالاً وإجابته، وستكون متاحة للجميع فوراً.</p>

    <input id="question" placeholder="اكتب السؤال الذي تريد تعليمي إياه">

    <textarea id="correctAnswer" placeholder="اكتب الإجابة الصحيحة"></textarea>

    <button class="learn" onclick="learn()">
        🧠 علّم النموذج (حفظ في السحابة)
    </button>

    <h3><i>💬</i> اسأل النموذج</h3>

    <input id="userQuestion" placeholder="اكتب سؤالك هنا">

    <button class="ask" onclick="ask()">
        🤖 اسأل AI ساهر
    </button>

    <div id="answer">
        مرحباً! أنا ساهر. تم ربطي بقاعدة بيانات سحابية. اسألني أي شيء أو علمني معلومة جديدة.
    </div>

    <p id="count">
        جاري الاتصال بقاعدة البيانات... <span id="countNumber">0</span> معلومة متاحة للجميع.
    </p>

    <button class="clear" onclick="clearMemory()">
        🗑️ مسح كل المعلومات (للمسؤول فقط)
    </button>

</div>

<!-- استيراد Firebase SDK -->
<script type="module">
    // استيراد الدوال اللازمة من Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";

    // إعدادات Firebase الخاصة بك
    const firebaseConfig = {
        apiKey: "AIzaSyAUmHcm0d0ErUph8l132llavVcUfwHWfic",
        authDomain: "gaming-platform-5ef6c.firebaseapp.com",
        projectId: "gaming-platform-5ef6c",
        storageBucket: "gaming-platform-5ef6c.firebasestorage.app",
        messagingSenderId: "332262507211",
        appId: "1:332262507211:web:dd51b094b7d3e4ab68914e",
        measurementId: "G-GVYDLMTY22"
    };

    // تهيئة Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const knowledgeCollection = collection(db, "knowledge");

    // متغير عام لتخزين البيانات محلياً بعد جلبها من السحابة (لتسريع البحث)
    let memory = [];
    // حالة التحميل
    let isLoading = true;

    // دالة لتنظيف النص للمقارنة
    function cleanText(text) {
        return text
            .toLowerCase()
            .trim()
            .replace(/[؟?!.,،؛]/g, "")
            .replace(/\s+/g, "");
    }

    // دالة حساب التشابه (نفس المنطق السابق)
    function similarity(text1, text2) {
        let clean1 = cleanText(text1);
        let clean2 = cleanText(text2);

        if (clean1 === clean2) return 1.0;

        let chars1 = clean1.split("");
        let chars2 = clean2.split("");

        if (chars1.length === 0 || chars2.length === 0) return 0;

        let common = 0;
        for (let char of chars1) {
            if (chars2.includes(char)) {
                common++;
            }
        }

        return (2 * common) / (chars1.length + chars2.length);
    }

    // دالة تحديث العداد وجلب البيانات من Firestore
    async function loadKnowledge() {
        try {
            isLoading = true;
            document.getElementById("count").innerHTML = 'جاري تحميل البيانات من السحابة... <span id="countNumber">0</span>';
            
            const querySnapshot = await getDocs(knowledgeCollection);
            const newMemory = [];
            querySnapshot.forEach((doc) => {
                const data = doc.data();
                newMemory.push({
                    id: doc.id,
                    question: data.question,
                    answer: data.answer
                });
            });
            
            memory = newMemory;
            updateCount();
            isLoading = false;
        } catch (error) {
            console.error("خطأ في تحميل البيانات: ", error);
            document.getElementById("count").innerHTML = '⚠️ تعذر الاتصال بقاعدة البيانات. تأكد من إعدادات Firebase.';
        }
    }

    // دالة تحديث العداد
    function updateCount() {
        const countElement = document.getElementById("count");
        if (memory.length > 0) {
            countElement.innerHTML = `عدد المعلومات المتاحة للجميع: <span id="countNumber">${memory.length}</span>`;
        } else {
            countElement.innerHTML = 'لا توجد معلومات بعد. كن أول من يضيف معلومة! <span id="countNumber">0</span>';
        }
    }

    // دالة التعليم (الحفظ في Firestore)
    window.learn = async function() {
        let question = document.getElementById("question").value.trim();
        let answer = document.getElementById("correctAnswer").value.trim();

        if (question === "" || answer === "") {
            alert("اكتب السؤال والإجابة أولًا");
            return;
        }

        if (isLoading) {
            alert("البيانات لا تزال قيد التحميل، يرجى الانتظار لحظة.");
            return;
        }

        // تعطيل الزر لمنع النقر المتكرر
        const learnBtn = document.querySelector('.learn');
        learnBtn.disabled = true;
        learnBtn.innerHTML = '⏳ جاري الحفظ...';

        try {
            // إضافة البيانات إلى Firestore
            const docRef = await addDoc(knowledgeCollection, {
                question: question,
                answer: answer,
                timestamp: new Date()
            });

            // إضافة البيانات إلى المصفوفة المحلية فوراً (بدون إعادة تحميل الصفحة)
            memory.push({
                id: docRef.id,
                question: question,
                answer: answer
            });

            // تفريغ الحقول
            document.getElementById("question").value = "";
            document.getElementById("correctAnswer").value = "";
            
            updateCount();
            alert("🧠 تم تعليم النموذج وحفظ المعلومة في السحابة بنجاح!");
            
        } catch (error) {
            console.error("خطأ في الحفظ: ", error);
            alert("حدث خطأ أثناء الحفظ. تأكد من اتصالك بالإنترنت وإعدادات Firestore.");
        } finally {
            // إعادة تفعيل الزر
            learnBtn.disabled = false;
            learnBtn.innerHTML = '🧠 علّم النموذج (حفظ في السحابة)';
        }
    };

    // دالة السؤال
    window.ask = function() {
        let question = document.getElementById("userQuestion").value.trim();

        if (question === "") {
            alert("اكتب سؤالًا أولًا");
            return;
        }

        if (isLoading) {
            document.getElementById("answer").innerText = "🤖 جاري تحميل قاعدة المعرفة، يرجى الانتظار...";
            return;
        }

        const answerDiv = document.getElementById("answer");

        // دعم العمليات الحسابية المباشرة
        let cleanMath = question.replace(/\s+/g, "").replace(/×/g, "*").replace(/÷/g, "/");
        if (/^[0-9]+[\+\-\*\/][0-9]+$/.test(cleanMath)) {
            try {
                let result = eval(cleanMath);
                answerDiv.innerText = `🤖 ناتج العملية الحسابية هو: ${result}`;
                return;
            } catch (e) {}
        }

        if (memory.length === 0) {
            answerDiv.innerText = "🤖 قاعدة البيانات فارغة حالياً. قم بتعليمي أول معلومة!";
            return;
        }

        let best = null;
        let bestScore = 0;

        for (let item of memory) {
            let score = similarity(question, item.question);
            if (score > bestScore) {
                bestScore = score;
                best = item;
            }
        }

        if (best && bestScore >= 0.75) {
            answerDiv.innerText = "🤖 " + best.answer;
        } else {
            answerDiv.innerText = "🤖 برمجني على هذه المعلومات أولاً لأن ساهر لم يخبرني بهذا 😅";
        }
    };

    // دالة المسح (حذف جميع الوثائق)
    window.clearMemory = async function() {
        if (!confirm("هل أنت متأكد من مسح كل المعلومات من قاعدة البيانات؟ لا يمكن التراجع عن هذا الإجراء!")) {
            return;
        }

        if (isLoading) {
            alert("يرجى الانتظار حتى يتم تحميل البيانات.");
            return;
        }

        const clearBtn = document.querySelector('.clear');
        clearBtn.disabled = true;
        clearBtn.innerHTML = '⏳ جاري المسح...';

        try {
            // جلب جميع الوثائق لحذفها
            const querySnapshot = await getDocs(knowledgeCollection);
            const deletePromises = [];
            querySnapshot.forEach((document) => {
                deletePromises.push(deleteDoc(doc(db, "knowledge", document.id)));
            });
            
            await Promise.all(deletePromises);
            
            memory = [];
            updateCount();
            document.getElementById("answer").innerText = "🤖 تم مسح جميع المعلومات من السحابة. برمجني من جديد!";
            alert("تم مسح قاعدة البيانات بنجاح.");
            
        } catch (error) {
            console.error("خطأ في المسح: ", error);
            alert("حدث خطأ أثناء محاولة المسح. قد تحتاج إلى صلاحيات المسؤول.");
        } finally {
            clearBtn.disabled = false;
            clearBtn.innerHTML = '🗑️ مسح كل المعلومات (للمسؤول فقط)';
        }
    };

    // تشغيل تحميل البيانات عند فتح الصفحة
    loadKnowledge();

</script>

</body>
</html>
