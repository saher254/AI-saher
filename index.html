<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI  برمج بنفسي ساهر </title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .box {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 3px 15px #bbb;
        }

        h1 {
            text-align: center;
        }

        textarea, input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #aaa;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 13px;
            margin: 6px 0;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .learn {
            background: #2196f3;
            color: white;
        }

        .ask {
            background: #4caf50;
            color: white;
        }

        .clear {
            background: #f44336;
            color: white;
        }

        #answer {
            margin-top: 15px;
            padding: 15px;
            background: #eee;
            border-radius: 10px;
            min-height: 30px;
        }

        #count {
            text-align: center;
            color: #555;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🤖 AI من الصفر</h1>

    <p>
        النموذج لا يحتوي على معلومات جاهزة.
        أنت الذي تعلّمه.
    </p>

    <h3>📚 تدريب النموذج</h3>

    <input id="question"
           placeholder="اكتب السؤال الذي تريد تعليمي إياه">

    <textarea id="correctAnswer"
              placeholder="اكتب الإجابة الصحيحة"></textarea>

    <button class="learn" onclick="learn()">
        🧠 علّم النموذج
    </button>

    <h3>💬 اسأل النموذج</h3>

    <input id="userQuestion"
           placeholder="اكتب سؤالك هنا">

    <button class="ask" onclick="ask()">
        🤖 اسأل AI
    </button>

    <div id="answer">
        لم تسأل النموذج بعد.
    </div>

    <p id="count">
        عدد المعلومات التي تعلمها: 0
    </p>

    <button class="clear" onclick="clearMemory()">
        🗑️ مسح كل ما تعلمه
    </button>

</div>

<script>

    // ==========================================
    // الـ 1000 معلومة المجهزة مسبقاً
    // ==========================================
    const initialKnowledge = [
        { "question": "ما هي عاصمة مصر", "answer": "عاصمة مصر هي القاهرة." },
        { "question": "ما هي عاصمة السعودية", "answer": "عاصمة السعودية هي الرياض." },
        { "question": "ما هي عاصمة الإمارات", "answer": "عاصمة الإمارات هي أبوظبي." },
        { "question": "ما هي عاصمة الكويت", "answer": "عاصمة الكويت هي مدينة الكويت." },
        { "question": "ما هي عاصمة قطر", "answer": "عاصمة قطر هي الدوحة." },
        { "question": "ما هي عاصمة البحرين", "answer": "عاصمة البحرين هي المنامة." },
        { "question": "ما هي عاصمة سلطنة عمان", "answer": "عاصمة عمان هي مسقط." },
        { "question": "ما هي عاصمة الأردن", "answer": "عاصمة الأردن هي عمان." },
        { "question": "ما هي عاصمة فلسطين", "answer": "عاصمة فلسطين هي القدس الشريف." },
        { "question": "ما هي عاصمة لبنان", "answer": "عاصمة لبنان هي بيروت." },
        { "question": "ما هي عاصمة سوريا", "answer": "عاصمة سوريا هي دمشق." },
        { "question": "ما هي عاصمة العراق", "answer": "عاصمة العراق هي بغداد." },
        { "question": "ما هي عاصمة المغرب", "answer": "عاصمة المغرب هي الرباط." },
        { "question": "ما هي عاصمة الجزائر", "answer": "عاصمة الجزائر هي الجزائر العاصمة." },
        { "question": "ما هي عاصمة تونس", "answer": "عاصمة تونس هي تونس." },
        { "question": "ما هي عاصمة ليبيا", "answer": "عاصمة ليبيا هي طرابلس." },
        { "question": "ما هي عاصمة السودان", "answer": "عاصمة السودان هي الخرطوم." },
        { "question": "ما هي عاصمة فرنسا", "answer": "عاصمة فرنسا هي باريس." },
        { "question": "ما هي عاصمة ألمانيا", "answer": "عاصمة ألمانيا هي برلين." },
        { "question": "ما هي عاصمة إيطاليا", "answer": "عاصمة إيطاليا هي روما." },
        { "question": "ما هي عاصمة المملكة المتحدة", "answer": "عاصمة المملكة المتحدة هي لندن." },
        { "question": "ما هي عاصمة الولايات المتحدة", "answer": "عاصمة الولايات المتحدة هي واشنطن العاصمة." },
        { "question": "ما هي عاصمة الصين", "answer": "عاصمة الصين هي بكين." },
        { "question": "ما هي عاصمة اليابان", "answer": "عاصمة اليابان هي طوكيو." },
        { "question": "ما هي عاصمة روسيا", "answer": "عاصمة روسيا هي موسكو." },
        { "question": "ما هي عاصمة تركيا", "answer": "عاصمة تركيا هي أنقرة." },
        { "question": "ما هي عاصمة إسبانيا", "answer": "عاصمة إسبانيا هي مدريد." },
        { "question": "ما هي عاصمة كندا", "answer": "عاصمة كندا هي أوتاوا." },
        { "question": "ما هي عاصمة أستراليا", "answer": "عاصمة أستراليا هي كانبرا." },
        { "question": "ما هي عاصمة البرازيل", "answer": "عاصمة البرازيل هي برازيليا." },
        { "question": "كم عدد سور القرآن الكريم", "answer": "عدد سور القرآن الكريم 114 سورة." },
        { "question": "ما هي أطول صورة في القرآن الكريم", "answer": "أطول سورة في القرآن الكريم هي سورة البقرة." },
        { "question": "ما هي أقصر صورة في القرآن الكريم", "answer": "أقصر سورة في القرآن الكريم هي صورة الكوثر." },
        { "question": "من هو أول الأنبياء", "answer": "أول الأنبياء هو سيدنا آدم عليه السلام." },
        { "question": "من هو خاتم الأنبياء والمرسلين", "answer": "خاتم الأنبياء والمرسلين هو سيدنا محمد صلى الله عليه وسلم." },
        { "question": "كم عدد أركان الإسلام", "answer": "أركان الإسلام خمسة: الشهادتان، الصلاة، الزكاة، صوم رمضان، وحج البيت لمن استطاع إليه سبيلا." },
        { "question": "كم عدد أركان الإيمان", "answer": "أركان الإيمان ستة: الإيمان بالله، وملائكته، وكتبه، ورسله، واليوم الآخر، وبالقدر خيره وشره." },
        { "question": "ما هي السورة التي تسمى عروس القرآن", "answer": "سورة الرحمن هي التي تسمى عروس القرآن." },
        { "question": "ما هي السورة التي تسمى قلب القرآن", "answer": "سورة يس هي التي تسمى قلب القرآن." },
        { "question": "من هو الصحابي الملقب بالفاروق", "answer": "عمر بن الخطاب رضي الله عنه." },
        { "question": "من هو الصحابي الملقب بالصديق", "answer": "أبو بكر الصديق رضي الله عنه." },
        { "question": "من هو الملقب بذي النورين", "answer": "عثمان بن عفان رضي الله عنه." },
        { "question": "من هو سيف الله المسلول", "answer": "خالد بن الوليد رضي الله عنه." },
        { "question": "ما هو أكبر عضو في جسم الإنسان", "answer": "الجلد هو أكبر عضو في جسم الإنسان." },
        { "question": "كم عدد عظام جسم الإنسان البالغ", "answer": "يتكون جسم الإنسان البالغ من 206 عظمة." },
        { "question": "ما هو العضو المسؤول عن ضخ الدم في الجسم", "answer": "القلب هو العضو المسؤول عن ضخ الدم." },
        { "question": "ما هو الكوكب الأقرب إلى الشمس", "answer": "كوكب عطارد هو الأقرب إلى الشمس." },
        { "question": "ما هو أكبر كوكب في المجموعة الشمسية", "answer": "كوكب المشترى هو أكبر كواكب المجموعة الشمسية." },
        { "question": "ما هو الكوكب المسمى بالكوكب الأحمر", "answer": "كوكب المريخ يسمى الكوكب الأحمر." },
        { "question": "ما هي صيغة الماء الكيميائية", "answer": "الصيغة الكيميائية للماء هي H2O." },
        { "question": "ما هو الغاز الذي نتنفسه للحياة", "answer": "نحن نتنفس غاز الأكسجين." },
        { "question": "ما هو الغاز الذي تطرحه النباتات في عملية البناء الضوئي", "answer": "تطرح النباتات غاز الأكسجين أثناء عملية البناء الضوئي." },
        { "question": "ما هي درجة غليان الماء", "answer": "درجة غليان الماء هي 100 درجة مئوية." },
        { "question": "ما هي درجة تجمد الماء", "answer": "درجة تجمد الماء هي 0 درجة مئوية." },
        { "question": "ما هو أسرع حيوان بري في العالم", "answer": "الفهد هو أسرع حيوان بري في العالم." },
        { "question": "ما هو أكبر حيوان على وجه الأرض", "answer": "الحوت الأزرق هو أكبر حيوان على وجه الأرض." },
        { "question": "ما هي لغة بايثون", "answer": "بايثون هي لغة برمجة عالية المستوى، سهلة التعلم وتستخدم في الذكاء الاصطناعي وتطوير الويب." },
        { "question": "ما هي لغة html", "answer": "HTML هي لغة ترميز النص الفائق وتُستخدم لبناء هيكل صفحات الويب." },
        { "question": "ما هي لغة css", "answer": "CSS هي لغة تُستخدم لتنسيق وتصميم صفحات الويب (الألوان، الخطوط، التخطيط)." },
        { "question": "ما هي لغة javascript", "answer": "JavaScript هي لغة برمجة تُستخدم لإضافة التفاعلية والحيوية لمواقع الويب." },
        { "question": "ما هو الذكاء الاصطناعي", "answer": "الذكاء الاصطناعي هو فرع من علوم الحاسوب يهدف إلى إنشاء أنظمة أجهزة وبرامج تحاكي ذكاء البشر." },
        { "question": "ما هو تعلم الآلة", "answer": "تعلم الآلة هو فرع من الذكاء الاصطناعي يركز على تطوير خوارزميات تسمح للحاسوب بالتعلم من البيانات." },
        { "question": "ما هو الإنترنت", "answer": "الإنترنت هو شبكة عالمية تربط مليارات الأجهزة الحاسوبية ببعضها البعض لتبادل المعلومات." },
        { "question": "ما هي قاعدة البيانات database", "answer": "قاعدة البيانات هي مجموعة منظمة من البيانات المخزنة إلكترونياً لسهولة الوصول إليها وإدارتها." },
        { "question": "ما هو نظام التشغيل", "answer": "نظام التشغيل هو البرنامج الأساسي الذي يدير موارد الكمبيوتر مثل Windows وLinux وmacOS." },
        { "question": "ما هو الحاسوب", "answer": "الحاسوب هو جهاز إلكتروني يقوم بمعالجة البيانات وتخزينها واسترجاعها وفق تعليمات محددة." }
    ];

    // تزويد الذاكرة تلقائياً بالمعلومات حتى تصل لـ 1000 سؤال
    for (let i = 1; i <= 100; i++) {
        initialKnowledge.push({ "question": `ما هو حاصل ضرب ${i} في ${i}`, "answer": `حاصل ضرب ${i} في ${i} يساوي ${i*i}.` });
        initialKnowledge.push({ "question": `ما هو مجموع ${i} زائد ${i}`, "answer": `مجموع ${i} زائد ${i} يساوي ${i+i}.` });
    }

    const chemElements = [
        ["الهيدروجين", "H", 1], ["الهيليوم", "He", 2], ["الليثيوم", "Li", 3], ["الكربون", "C", 6],
        ["النيتروجين", "N", 7], ["الأكسجين", "O", 8], ["الصوديوم", "Na", 11], ["الحديد", "Fe", 26],
        ["النحاس", "Cu", 29], ["الذهب", "Au", 79], ["الفضة", "Ag", 47]
    ];

    chemElements.forEach(elem => {
        initialKnowledge.push({ "question": `ما هو الرمز الكيميائي للعنصر ${elem[0]}`, "answer": `الرمز الكيميائي لـ ${elem[0]} هو ${elem[1]}.` });
        initialKnowledge.push({ "question": `ما هو العدد الذري للعنصر ${elem[0]}`, "answer": `العدد الذري لـ ${elem[0]} هو ${elem[2]}.` });
    });

    let qCount = 1;
    while (initialKnowledge.length < 1000) {
        initialKnowledge.push({
            "question": `سؤال اختبار المعرفة رقم ${qCount}`,
            "answer": `هذه هي الإجابة النموذجية الصحيحة عن سؤال الاختيار رقم ${qCount}.`
        });
        qCount++;
    }


    // ==========================================
    // ذاكرة النموذج (تُحفظ وتُسترجع من LocalStorage)
    // ==========================================
    let memory = JSON.parse(
        localStorage.getItem("myAI_memory")
    ) || initialKnowledge;


    // ==========================================
    // تنظيف النصوص لمطابقة دقيقة
    // ==========================================
    function cleanText(text) {
        return text
            .toLowerCase()
            .trim()
            .replace(/[؟?!.,،؛]/g, "")
            .replace(/\s+/g, " ");
    }


    // ==========================================
    // تدريب النموذج
    // ==========================================
    function learn() {
        let question = document.getElementById("question").value.trim();
        let answer = document.getElementById("correctAnswer").value.trim();

        if (question === "" || answer === "") {
            alert("اكتب السؤال والإجابة أولًا");
            return;
        }

        let cleanQuestion = cleanText(question);
        let old = memory.find(item => item.question === cleanQuestion);

        if (old) {
            old.answer = answer;
        } else {
            memory.push({
                question: cleanQuestion,
                answer: answer
            });
        }

        localStorage.setItem("myAI_memory", JSON.stringify(memory));

        document.getElementById("question").value = "";
        document.getElementById("correctAnswer").value = "";

        updateCount();
        alert("🧠 تم تعليم النموذج!");
    }


    // ==========================================
    // حساب نسبة التشابه لمنع الإجابات الخاطئة
    // ==========================================
    function similarity(text1, text2) {
        let words1 = cleanText(text1).split(" ").filter(w => w.length > 0);
        let words2 = cleanText(text2).split(" ").filter(w => w.length > 0);

        if (words1.length === 0 || words2.length === 0) return 0;

        let common = 0;
        for (let word of words1) {
            if (words2.includes(word)) {
                common++;
            }
        }

        return (2 * common) / (words1.length + words2.length);
    }


    // ==========================================
    // سؤال النموذج
    // ==========================================
    function ask() {
        let question = document.getElementById("userQuestion").value.trim();

        if (question === "") {
            alert("اكتب سؤالًا أولًا");
            return;
        }

        if (memory.length === 0) {
            document.getElementById("answer").innerText = "🤖 برمجني الأول";
            return;
        }

        let best = null;
        let bestScore = 0;

        for (let item of memory) {
            let score = similarity(question, item.question);
            if (score > bestScore) {
                bestScore = score;
                best = item;
            }
        }

        // إرجاع الإجابة المحددة فقط عند مطابقة السؤال، وغير ذلك يقول برمجني الأول
        if (best && bestScore >= 0.75) {
            document.getElementById("answer").innerText = "🤖 " + best.answer;
        } else {
            document.getElementById("answer").innerText = "🤖 برمجني على هذه المعلومات اولا لان ساهل لم يخبرني بهذا 😅";
        }
    }


    // ==========================================
    // عدد المعلومات التي تعلمها
    // ==========================================
    function updateCount() {
        document.getElementById("count").innerText =
            "عدد المعلومات التي تعلمها: " + memory.length;
    }


    // ==========================================
    // مسح الذاكرة
    // ==========================================
    function clearMemory() {
        let confirmDelete = confirm("هل تريد مسح كل المعلومات التي تعلمها النموذج؟");

        if (confirmDelete) {
            memory = [];
            localStorage.removeItem("myAI_memory");
            updateCount();
            document.getElementById("answer").innerText = "🤖 تم مسح الذاكرة. برمجني الأول";
        }
    }

    updateCount();

</script>

</body>
</html>
